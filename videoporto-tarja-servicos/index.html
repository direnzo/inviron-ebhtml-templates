<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/master.css">
    
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <script src="js/mock-data.js"></script>
    
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    
    <title>VIDEOPORTO - Tarja de Serviços</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>

<body>
    <!-- Container fixo 312x100px -->
    <div id="container" class="w-312 h-100">
        <!-- Slide 1: Data e Hora -->
        <div class="slide slide-hora" data-type="hora">
            <div class="slide-content">
                <div class="slide-label">Quarta-feira</div>
                <div class="slide-value" id="hora-value">13:45</div>
                <div class="slide-label" id="hora-date">13 de março de 2026</div>
            </div>
        </div>

        <!-- Slide 2: Clima -->
        <div class="slide slide-clima" data-type="clima">
            <div class="slide-content with-icon">
                <div class="slide-icon" id="clima-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="slide-text">
                    <div class="slide-label">Nublado</div>
                    <div style="display: flex; align-items: baseline;">
                        <div class="slide-value" id="clima-temp">30</div>
                        <div style="font-size: 11px; margin-left: 2px;">°C</div>
                    </div>
                    <div style="display: flex; gap: 10px; font-size: 9px;">
                        <div>Mín <span id="clima-min">28</span>°C</div>
                        <div>Máx <span id="clima-max">34</span>°C</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 3: Ondas -->
        <div class="slide slide-ondas" data-type="ondas">
            <div class="slide-content with-icon">
                <div class="slide-icon" id="ondas-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="slide-text">
                    <div class="slide-label">Ondas</div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <div class="slide-value" id="ondas-altura">2.4</div>
                        <div style="font-size: 11px;">m</div>
                    </div>
                    <div style="font-size: 9px;" id="ondas-horario">04:02</div>
                </div>
            </div>
        </div>

        <!-- Slide 4: Raios Solar (UV) -->
        <div class="slide slide-uv" data-type="uv">
            <div class="slide-content with-icon">
                <div class="slide-icon" id="uv-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="slide-text">
                    <div class="slide-label">Proteção Solar</div>
                    <div class="slide-value" id="uv-msg">Máxima  UV</div>
                </div>
            </div>
        </div>

        <!-- Slide 5: Cotações -->
        <div class="slide slide-cambio" data-type="cambio">
            <div class="slide-content with-icon">
                <div class="slide-icon" id="cambio-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="slide-text">
                    <div class="slide-label" id="cambio-moeda">USD</div>
                    <div style="display: flex; align-items: baseline;">
                        <div class="slide-value" id="cambio-valor">5.45</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 6: Mensagem de Aviso -->
        <div class="slide slide-comunicado" data-type="comunicado">
            <div class="slide-content">
                <div class="slide-text">
                    <div class="slide-value" id="comunicado-msg">Proteja sua pele!\nO nível de UV agora pela manhã\nestá otíssimo.</div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
