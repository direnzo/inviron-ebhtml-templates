<!DOCTYPE html>
<html lang="pt-br" class="w-full h-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personare Dicas</title>
    <link rel="stylesheet" href="css/master.css">
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
</head>

<!--
    Layout:
    Landscape / ultrawide: flex-row — conteúdo à esquerda (~38%), imagem à direita (~62%)
    Portrait / empena:     flex-col — imagem no topo (~40%), conteúdo abaixo (~60%)
-->
<body class="opacity-0 transition-opacity duration-1000
             w-full h-full overflow-hidden
             flex flex-row items-stretch
             portrait:flex-col">

    <!-- Fundo decorativo — painel roxo (esquerda/texto) + branco (direita/imagem) -->
    <div class="fundo-dicas absolute inset-0 bg-cover bg-no-repeat bg-center pointer-events-none"></div>

    <!-- ZONA DE CONTEÚDO (esquerda em landscape, baixo em portrait) -->
    <div class="relative w-[38%] shrink-0 flex flex-col justify-center
                px-[4%] py-[5%] gap-[5%]
                portrait:w-full portrait:h-[55%] portrait:order-2
                portrait:px-[6%] portrait:py-[4%] portrait:gap-[4%]
                ultrawide:w-[32%]">

        <div id="titulo" class="w-full overflow-hidden">
            <p class="font-montserrat-extrabold text-white tracking-wide leading-tight
                       text-[3.2vw] portrait:text-[4.5vh] ultrawide:text-[2.5vw]"></p>
        </div>

        <div id="texto" class="w-full overflow-hidden flex-1">
            <p class="font-montserrat-regular text-white leading-snug
                       text-[2vw] portrait:text-[3vh] ultrawide:text-[1.6vw]"></p>
        </div>

    </div>

    <!-- ZONA DA IMAGEM (direita em landscape, topo em portrait) -->
    <div class="relative flex-1 overflow-hidden
                portrait:w-full portrait:h-[45%] portrait:order-1 portrait:flex-none">
        <img id="imagem"
             class="w-full h-full object-cover animate-expande origin-center" />
    </div>

</body>
</html>
