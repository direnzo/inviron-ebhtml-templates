<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populari - abertura GIF (legacy / QtWebKit 534)</title>
    <link rel="stylesheet" href="css/master.css">
    <script src="js/ebhtml.js"></script>
    <!-- <script src="js/mock-data.js"></script> --> <!-- descomentar apenas em desenvolvimento -->
    <script src="js/master.js"></script>
</head>

<body class="populari-body">

    <div id="stage">

        <!-- Foto em tela cheia (fundo). No engine legado a imagem e pintada
             como background-image de #foto (nao ha object-fit); o <img> abaixo
             fica oculto e serve so para detectar load/erro. -->
        <div id="foto">
            <img id="foto-img" src="" alt="">
        </div>

        <!-- Degrade preto -> transparent atras do texto -->
        <div id="gradiente"></div>

        <!-- Moldura: 2 divs. #moldura = quadro todo laranja;
             #moldura-base sobrepoe a metade de baixo com branco. -->
        <div id="moldura"></div>
        <div id="moldura-base"></div>

        <!-- Logo no canto superior direito -->
        <img id="logo" src="img/logo_populari.png" alt="Populari">

        <!-- Texto da noticia -->
        <div id="texto-wrap">
            <p id="texto"></p>
        </div>

        <!-- Abertura: GIF animado da vinheta em tela cheia por INTRO_MS antes
             da noticia. O <video> HTML5 nao funciona neste engine; o QtWebKit
             anima GIF nativamente. <img> (nao background) para animar de forma
             confiavel. src definido no master.js; onerror cai pro .jpg. -->
        <div id="intro"><img id="intro-img" src="" alt=""></div>

    </div>

</body>

</html>
