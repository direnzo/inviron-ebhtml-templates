<!DOCTYPE html>
<html lang="pt-br" class="w-full h-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personare Dicas</title>
    <link rel="stylesheet" href="css/master.css">
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
</head>

<!--
    Layout:
    Landscape / ultrawide: flex-row — conteúdo à esquerda (~38%), imagem à direita (~62%)
    Portrait / empena:     flex-col — imagem no topo (~40%), conteúdo abaixo (~60%)
-->
<body class="text-[3.2vmin] w-full h-full overflow-hidden bg-[#343a67]">

    <!-- Fundo decorativo — painel roxo (esquerda/texto) + branco (direita/imagem) -->
    <div class="fundo-dicas absolute inset-0 bg-[#343a67] bg-cover bg-no-repeat bg-left-bottom pointer-events-none"></div>

        <div id="conteudo-dinamico" class="relative z-10 w-full h-full flex flex-row items-stretch opacity-0 transition-opacity duration-700">

            <!-- ZONA DE CONTEÚDO (esquerda em landscape, baixo em portrait) -->
            <div class="relative w-[38%] shrink-0 flex flex-col justify-start
                                    ps-[3%] pe-[1%] py-[5%] space-y-[5%]
                                    portrait:w-full portrait:h-[55%] portrait:order-2
                                    portrait:px-[6%] portrait:py-[4%] portrait:space-y-[4%]
                                    ultrawide:w-[32%] superbanner:w-[30%] empena:w-full empena:h-[55%]">

        <div id="titulo" class="w-full shrink-0 max-h-[30%] overflow-hidden">
            <p class="font-montserrat-extrabold text-white tracking-wide leading-tight text-nowrap
                       text-[3.8vmin]"></p>
        </div>

        <div id="texto-container" class="w-full flex-1 min-h-0 max-h-[24vh] landscape:max-h-[48vh]">
            <p id="texto" class="font-montserrat-regular text-white leading-snug h-full text-start text-[1.05em]"></p>
        </div>

      </div>

      <!-- ZONA DA IMAGEM (direita em landscape, topo em portrait) -->
      <div class="relative flex-1 min-w-0 overflow-hidden
                  portrait:w-full portrait:h-[45%] portrait:order-1 portrait:flex-none
                  empena:w-full empena:h-[45%]">
          <img id="imagem"
               class="w-full h-full object-cover animate-expande origin-center" />
      </div>

    </div>

</body>
</html>
