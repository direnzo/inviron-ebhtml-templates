<!DOCTYPE html>
<html lang="pt-BR" class="w-full h-full overflow-hidden ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menuboard</title>

  <link rel="stylesheet" href="css/master.css">
  <!-- ⚠️ MOCK DATA: Descomentar linha abaixo para testes locais -->
  <script src="js/mock-data.js" defer></script>
  <script src="js/ebhtml.js" defer></script>
  <script src="js/master.js" defer></script>
</head>

<body
  class="w-full h-full flex-col overflow-hidden flex items-center justify-start bg-[url('../img/fundo.png')] bg-cover font-futura-bold text-[4vh] leading-none px-10">
  <div id="title" class="text-white text-[180%] italic w-full ml-14 p-10 uppercase"></div>
  <img class="absolute top-[3%] right-[2%] z-10 w-[12vw]" src="img/clube.png" alt="Logo Clube">

  <div id="table-container"
    class="w-full h-fit rounded-[1vh] bg-blue-900 opacity-0 transition-opacity duration-700 flex flex-col overflow-hidden">
    
    <!-- Container de Linhas -->
    <div id="content-rows" class="flex flex-col divide-y divide-gray-100 flex-1 text-white"></div>

    <!-- Template de linha -->
    <template id="row-template">
      <div
        class="flex justify-between items-center p-1 opacity-0 translate-y-4 transform transition-all duration-500 flex-1 min-h-[9.6vh] px-6">
        <p class="descr text-balance	"></p>
        <span class="flex gap-8  items-center ">
          <p class="price text-[100%] text-gray-300 text-right text-nowrap "></p>
          <p class="club text-[130%] text-yellow-500 w-[18vw] text-center text-nowrap"></p>
        </span>
      </div>
    </template>

  </div>
</body>

</html>
