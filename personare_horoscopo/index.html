<!DOCTYPE html>
<html lang="pt-br" class="w-full h-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horóscopo Personare</title>
    <link rel="stylesheet" href="css/master.css">
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
</head>

<body class="opacity-0 transition-opacity duration-1000 relative w-full h-full overflow-hidden bg-black">

    <!-- Fundo com pan automático via background-position -->
    <div class="fundo-bg absolute inset-0 bg-cover bg-no-repeat animate-pan-fundo"></div>

    <!--
        Layout principal:
        Default (landscape / ultrawide / square): flex-row — ícone à esquerda, conteúdo à direita
        Portrait: flex-col — ícone em cima, conteúdo embaixo
    -->
    <div class="absolute inset-0 flex flex-row items-stretch
                portrait:flex-col portrait:items-center">

        <!-- ZONA DO ÍCONE -->
        <div class="w-[22%] shrink-0 flex items-center justify-center pl-[2%]
                    portrait:w-full portrait:h-[32%] portrait:pl-0 portrait:pt-[5%]">
            <img id="icone"
                 class="w-[80%] max-h-full object-contain
                        portrait:w-auto portrait:h-full" />
        </div>

        <!-- ZONA DE CONTEÚDO: cabeçalho + título + texto -->
        <div class="flex-1 flex flex-col justify-center py-[5%] pr-[4%] pl-[1%]
                    portrait:w-full portrait:flex-1 portrait:px-[8%] portrait:pt-[5%] portrait:pb-[4%] portrait:justify-start">

            <!-- Cabeçalho: label HORÓSCOPO DO DIA + logo -->
            <div class="flex items-center justify-between mb-[3%]
                        portrait:w-full portrait:mb-[5%]">
                <span class="font-open-sans-regular text-black
                             text-[3vw] ultrawide:text-[2vw]
                             portrait:text-[3.5vh]">
                    HORÓSCOPO DO DIA
                </span>
                <img src="img/logo.png"
                     class="w-[22%] ultrawide:w-[15%]
                            portrait:w-auto portrait:h-[5.5vh]" />
            </div>

            <!-- Título do signo -->
            <div id="titulo" class="w-full mb-[3%] portrait:mb-[4%] portrait:text-center">
                <p class="font-bold text-[#759cc0] tracking-widest leading-tight
                           text-[5.5vw] ultrawide:text-[4vw]
                           portrait:text-[6vh]"></p>
            </div>

            <!-- Texto do horóscopo -->
            <div id="texto" class="w-full max-h-[45%] overflow-hidden
                                   portrait:text-center portrait:max-h-[40%]">
                <p class="font-open-sans-regular text-black leading-snug
                           text-[2.2vw] ultrawide:text-[1.8vw]
                           portrait:text-[2.8vh]"></p>
            </div>

        </div>

    </div>

</body>
</html>
