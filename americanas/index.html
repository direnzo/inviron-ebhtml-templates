<!DOCTYPE html>
<html class="overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMERICANAS - Consulta de Preços</title>
    <link rel="stylesheet" href="css/master.css">
    
    <!-- Detecção de performance e desabilita animações em dispositivos fracos -->
    <script>
        (function() {
            // Detecta se é Android ou dispositivo móvel com baixa performance
            var isLowPerformance = false;
            
            // Verifica se é Android
            var isAndroid = /Android/i.test(navigator.userAgent);
            
            // Verifica se tem menos de 4GB de RAM (se disponível)
            var hasLowMemory = navigator.deviceMemory && navigator.deviceMemory < 4;
            
            // Verifica se tem menos de 4 cores
            var hasLowCores = navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4;
            
            // Verifica preferência do usuário por movimento reduzido
            var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            // Marca como baixa performance se qualquer condição for verdadeira
            if (isAndroid || hasLowMemory || hasLowCores || prefersReducedMotion) {
                isLowPerformance = true;
                document.documentElement.classList.add('no-animations');
                console.log('🐢 Modo de baixa performance ativado');
            } else {
                // document.documentElement.classList.add('no-animations');

                console.log('🚀 Modo de alta performance ativado');
            }
        })();
    </script>
    
    <script src="js/fittext.js"></script>
    <script src="js/ebhtml.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/master.js"></script>
</head>

<body class="relative bg-black m-0 w-full h-full overflow-hidden">
<!-- Fullscreen Black Overlay -->
    <div id="fullscreen-black" class="fixed inset-0 w-full h-full bg-black" style="z-index: 2147483647;"></div>
    <!-- imagem de background em tela cheia -->
    <div class="absolute inset-0 z-0 bg-red-700">
        <!-- Background otimizado com gradient CSS puro -->
        <div class="absolute inset-0 bg-white"></div>
    </div>

    <!-- Logo no Topo (fixo em ambos os modos) -->
    <header class="absolute top-0 left-0 w-full z-50 p-4 md:p-6 border-b-8 border-white bg-red-700">
        <img id="logo" src="img/logo_branco.png" class="h-12 md:h-16 lg:h-20 w-auto mx-auto opacity-0 animate-fade-in-delay-1"/>
    </header>

    <!-- Container Principal - Layout Responsivo -->
    <main class="w-full h-full portrait:pt-[15%] landscape:pt-[10%] pb-8 flex flex-col portrait:flex-col landscape:flex-row portrait:justify-evenly landscape:justify-center portrait:items-center landscape:items-center gap-6 md:gap-8 lg:gap-12 z-10 relative opacity-0 transition-opacity duration-[500ms] animate-fade-in-delay-2" style="width:min(100vw, calc(100vh * 0.625)); height:min(100vh, calc(100vw * 1.6)); margin:0 auto;">
        
        <!-- Container da Foto (ordem 2 em portrait, ordem 1 em landscape) -->
        <div class="portrait:order-2 landscape:order-1 portrait:w-full landscape:w-1/3 portrait:h-auto landscape:h-full flex portrait:flex-col landscape:items-center landscape:justify-center portrait:items-center portrait:gap-4 px-4 md:px-8">
            
            <!-- Foto do Produto -->
            <div class="w-full portrait:h-[45vh] landscape:h-full flex items-center justify-center opacity-0 animate-slide-in-img">
                <img id="produto" class="max-w-full max-h-full object-contain"/>
            </div>
            
            <!-- Preço Portrait (visível apenas em portrait) -->
            <div class="portrait:flex landscape:hidden w-full items-center justify-center gap-4 mt-4">
                <div id="moeda-portrait" class="opacity-0 animate-slide-in-moeda font-poppins-extrabold text-red-700">R$</div>
                <div id="preco-portrait" class="opacity-0 animate-slide-in-preco font-poppins-extrabold text-red-700"></div>
            </div>
        </div>

        <!-- Container de Informações (ordem 1 em portrait, ordem 2 em landscape) -->
        <div class="portrait:order-1 landscape:order-2 portrait:w-full landscape:w-2/3 portrait:h-auto landscape:h-full flex flex-col justify-center items-start px-6 md:px-8 lg:px-12 portrait:pt-4 portrait:pb-4 landscape:pt-0 landscape:pe-[10%] pb-[10%] gap-[10%]">
            
            <!-- Título -->
            <div id="titulo" class="opacity-0 animate-fade-in font-poppins-semibold font-bold text-black portrait:text-center landscape:text-left"></div>

            <!-- Preço Landscape (visível apenas em landscape) -->
            <div class="portrait:hidden landscape:flex w-full items-center gap-[8%] landscape:justify-center">
                <div id="moeda" class="opacity-0 animate-slide-in-moeda font-poppins-extrabold text-red-700">R$</div>
                <div id="preco" class="opacity-0 animate-slide-in-preco font-poppins-extrabold text-red-700">0</div>
            </div>
        </div>

    </main>

    <!-- Áudio (invisível) -->
    <audio id="audio" class="opacity-0"></audio>

    <!-- Div para debug de tamanho -->
    <div id="size" class="fixed text-sm text-black top-0 right-0 bg-yellow-200 p-2 font-bold z-[100] hidden"></div>

    <!-- Mensagem de erro -->
    <div id="msg" class="fixed inset-0 w-full h-full bg-black z-[999]
                         justify-center items-center text-center
                         text-white font-poppins-extrabold
                         text-4xl md:text-5xl lg:text-6xl
                         hidden [&:not(.hidden)]:flex [&:not(.hidden)]:flex-col">
        <p class="m-0">PRODUTO NÃO</p>
        <p class="m-0 mt-4">ENCONTRADO</p>
    </div>
</body>

</html>
