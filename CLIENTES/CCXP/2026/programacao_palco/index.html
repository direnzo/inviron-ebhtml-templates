<!DOCTYPE html>
<html lang="pt-BR" class="w-full h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCXP26 Programação por Palco</title>
    <link rel="stylesheet" href="css/master.css">

    <!-- Scripts (ordem importa: config antes de mock e master) -->
    <script src="js/ebhtml.js"></script>
    <script src="js/config.js"></script>
    <script src="js/mock-data.js"></script> <!-- Comentar em produção -->
    <script src="js/programacao.js"></script>
    <script src="js/master.js"></script>
</head>
<body class="w-full h-full m-0 overflow-hidden bg-black">
    <!-- Tela fixa 1080x1920; o JS escala para a janela (preview). No player a escala é 1. -->
    <div id="stage" class="absolute left-0 top-0 w-[1080px] h-[1920px] origin-top-left overflow-hidden bg-black opacity-0">
        <div id="panels" class="absolute inset-0"></div>
        <!-- Barra inferior persistente: logo CCXP26 + relógio -->
        <div id="barra" class="absolute inset-0 z-30">
            <div id="barraFundo" class="absolute left-0 w-full bg-black"></div>
            <img id="logo" class="absolute" alt="CCXP26">
            <div id="relogio" class="absolute left-0 text-right text-white whitespace-nowrap"></div>
        </div>
        <video id="videoIntro" muted playsinline preload="auto" class="absolute inset-0 z-50 w-full h-full object-cover opacity-0 transition-opacity duration-300"></video>
        <video id="videoOutro" muted playsinline preload="auto" class="absolute inset-0 z-50 w-full h-full object-cover opacity-0 transition-opacity duration-300"></video>
    </div>

    <!-- Painel de 1 evento (Rolando Agora / Daqui a pouco) -->
    <template id="tplSingle">
        <section class="panel absolute inset-0 opacity-0 transition-opacity duration-300">
            <div class="bg-art absolute inset-0 bg-no-repeat"></div>
            <img class="topo absolute" alt="">
            <div class="frame-title absolute left-0 w-full text-center whitespace-nowrap uppercase"></div>
            <div class="foto absolute overflow-hidden">
                <img class="foto-img w-full h-full object-cover" alt="">
            </div>
            <div class="hora absolute whitespace-nowrap"></div>
            <div class="descricao absolute overflow-hidden uppercase break-words"></div>
        </section>
    </template>

    <!-- Painel de lista (Ainda hoje) -->
    <template id="tplLista">
        <section class="panel absolute inset-0 opacity-0 transition-opacity duration-300">
            <div class="bg-art absolute inset-0 bg-no-repeat"></div>
            <img class="topo absolute" alt="">
            <div class="frame-title absolute left-0 w-full text-center whitespace-nowrap uppercase"></div>
            <div class="itens absolute inset-0"></div>
        </section>
    </template>

    <template id="tplItem">
        <div class="item absolute inset-0">
            <div class="thumb absolute overflow-hidden bg-white border border-black box-border">
                <img class="thumb-img w-full h-full object-cover" alt="">
            </div>
            <div class="hora absolute whitespace-nowrap"></div>
            <div class="descricao absolute overflow-hidden uppercase break-words"></div>
        </div>
    </template>
</body>
</html>
