<html>

<head>
    <meta charset="UTF-8">
    <title>Projeto Especial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/master.css">
    <script src="js/ebhtml.js"></script>
    <!-- <script src="js/mock-data.js"></script>MOCK: remova em produção -->
    <script src="js/master.js"></script>
    <!-- <script src="js/preview.js"></script> -->
    <script>
        check_element = window.parent.document.getElementById('template_check');
        if (check_element != null) {
            console.log('EXTRANET')
            extranetView()
        } else {
            console.log('PLAYER')
            playerView()
        }
    </script>
</head>

<body class="bg-black overflow-hidden font-inter text-[2vh] landscape:text-[2vw] text-black">
    <div id="size" class="absolute top-0 left-0 z-50 bg-yellow-400 text-red-600 text-3xl p-5 hidden"></div>
    <!-- Fundo para a foto com animação de fade-in e scale -->
    <div id="backgroundImage" class="absolute top-0 right-0 bottom-0 left-0 bg-cover bg-center z-0 w-full h-full">
        <img id='image' class="h-full w-full object-fill" />
    </div>

    <div id="fullContent" class="relative w-full h-screen flex flex-col p-5 z-10 space-y-2 opacity-0 transition-opacity duration-1000">

        <!-- Logo Container -->
        <div id="logo_container" class="flex items-center justify-center h-[13vh] w-full opacity-0 transition-opacity duration-1000">
            <img id="logo" class="max-h-full" />
        </div>

        <!-- Conteúdo Flexível -->
        <div class="flex flex-col portrait:flex-col landscape:flex-row w-full space-y-2 landscape:space-y-0 landscape:space-x-2 mt-[4vh]">
            <!-- Seção Título, Imagem e Preço (lado esquerdo no landscape) -->
            <div class="flex flex-col portrait:w-full landscape:w-[50%] space-y-2">
                <!-- Título -->
                <div id="title_container"
                    class="flex items-center justify-center h-[10vh] landscape:h-[38vh] ">
                    <div id="title" class="text-[150%] font-black text-center mx-2 text-black"></div>
                </div>

                <!-- Imagem Container (no portrait está entre o título e o preço) -->
                <div id="img_container_portrait"
                    class="flex items-center justify-center h-[30vh] portrait:flex landscape:hidden">
                    <img id="product_img_portrait" class="max-h-full max-w-full" />
                </div>

                <!-- Preco: conteudo injetado pelo JS via templates #cond-1..#cond-14 -->
                <div id="price_container" class="flex items-center justify-center h-[20vh] landscape:h-[40vh] w-full"></div>
            </div>

            <!-- Imagem do Produto (lado direito no landscape) -->
            <div id="img_container_landscape"
                class="hidden landscape:flex items-center justify-center w-[50%] ">
                <img id="product_img_landscape" class="max-h-full max-w-full landscape:max-h-[65vh]" />
            </div>

        </div>
        <div id="legal_text" class="text-[50%] flex items-center justify-center h-[2vh] w-full "></div>
    </div>

    <!-- ================================================================
         TEMPLATES DE CONDICAO DE PRECO — ativados por renderCondition()
         Edite o layout de uma condicao aqui. O JS so preenche data-fill.
         ================================================================ -->

    <!-- Tipo 1: Preco simples — destaque total -->
    <template id="cond-1">
        <div class="flex flex-col items-center justify-center w-full scale-125">
            <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600 animate-pulseScaleWithDelay"></div>
        </div>
    </template>

    <!-- Tipo 2: DE (price2) POR: + price1 -->
    <template id="cond-2">
        <div class="flex flex-col items-center justify-center w-full">
            <div class="text-[110%] font-black flex flex-row items-center self-start ml-5 mb-2 text-black">
                DE&nbsp;<span data-fill="price2-raw" class="text-[150%] mx-1 diagonal-strike"></span>&nbsp;POR:
            </div>
            <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600 animate-pulseScaleWithDelay"></div>
        </div>
    </template>

    <!-- Tipo 3: Desconto de (price2) + price1 -->
    <template id="cond-3">
        <div class="flex flex-col items-center justify-center w-full">
            <div class="text-[110%] font-black flex flex-row items-center self-start ml-5 mb-2 text-black">
                Desconto de&nbsp;<span data-fill="price2-pct" class="text-[150%] mx-1"></span>
            </div>
            <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600 animate-pulseScaleWithDelay"></div>
        </div>
    </template>

    <!-- Tipo 4: LEVE (price2) PAGUE (price3) POR APENAS + price1 -->
    <template id="cond-4">
        <div class="flex flex-col items-center justify-center w-full">
            <div class="text-[105%] font-black flex flex-row items-center flex-wrap self-center ml-5 mb-2 text-black leading-tight">
                LEVE&nbsp;<span data-fill="price2-raw" class="text-[150%] mx-1"></span>&nbsp;PAGUE&nbsp;<span data-fill="price3-raw" class="text-[150%] mx-1"></span>&nbsp;POR APENAS
            </div>
            <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600 animate-pulseScaleWithDelay"></div>
        </div>
    </template>

    <!-- Tipo 5: VAREJO price1 | NESTA EMBALAGEM A (unitpack) SAI POR: price2 -->
    <template id="cond-5">
        <div class="flex flex-col  w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[70%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[75%] font-bold text-center leading-tight mb-1">
                    NESTA EMBALAGEM A <span data-fill="unitpack"></span> SAI POR:
                </div>
                <div class="text-[120%]">
                    <div data-fill="price2" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 6: VAREJO price1 | ATACADO OU CREDIFFATO price2 -->
    <template id="cond-6">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[70%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[75%] font-bold text-center leading-tight mb-1">ATACADO OU CREDIFFATO</div>
                <div class="text-[120%]">
                    <div data-fill="price2" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 7: VAREJO price1 | ATACADO price3 + EMBALAGEM price2 (a unitpack sai por) -->
    <template id="cond-7">
        <div class="flex flex-row w-full items-center justify-center h-full">
            <div class="flex flex-col items-center justify-center  px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[40%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-around  px-2 text-black">
                <div class="flex flex-col items-center mb-2">
                    <div class="text-[72%] font-bold text-center leading-tight">ATACADO OU CREDIFFATO</div>
                    <div class="text-[72%]">
                        <div data-fill="price3" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="text-[65%] font-bold text-center leading-tight">NESTA EMBALAGEM A <span data-fill="unitpack"></span> SAI POR:</div>
                    <div class="text-[90%]">
                        <div data-fill="price2" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 8: VAREJO price1 | CLIENTE CLUBEFATO price2 -->
    <template id="cond-8">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[70%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[75%] font-bold text-center leading-tight mb-1">CLIENTE CLUBEFATO</div>
                <div class="text-[120%]">
                    <div data-fill="price2" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 9: VAREJO price1 + LEVE/PAGUE | CLIENTE CLUBEFATO (unitpack como preco) -->
    <template id="cond-9">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[62%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
                <div class="text-[80%] font-black text-black mt-1 leading-tight">
                    LEVE <span data-fill="price2-raw" class="text-[130%]"></span>
                    PAGUE <span data-fill="price3-raw" class="text-[130%]"></span>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[75%] font-bold text-center leading-tight mb-1">CLIENTE CLUBEFATO</div>
                <div class="text-[102%]">
                    <div data-fill="price-unitpack" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 10: VAREJO price1 | CLUBEFATO price2% desconto 2a unidade -->
    <template id="cond-10">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[100%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[75%] font-bold text-center leading-tight mb-1">CLIENTE CLUBEFATO</div>
                <div class="text-[70%]">
                    <div data-fill="price2-pct" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
                <div class="text-[70%] font-bold text-center leading-tight mt-1">de desconto na 2ª un.</div>
            </div>
        </div>
    </template>

    <!-- Tipo 11: VAREJO price1 | CLUBEFATO price2% + EMBALAGEM price-unitpack -->
    <template id="cond-11">
        <div class="flex flex-row w-full items-center justify-center h-full">
            <div class="flex flex-col items-center justify-center px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[40%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center px-2 text-black">
                <div class="flex flex-col items-center mb-2">
                    <div class="text-[72%] font-bold text-center leading-tight">CLIENTE CLUBEFATO</div>
                    <div class="text-[52%]">
                        <div data-fill="price2-pct" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                    </div>
                    <div class="text-[65%] font-bold text-center leading-tight">de desconto na 2ª un.</div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="text-[65%] font-bold text-center leading-tight">NESTA EMBALAGEM SAI POR:</div>
                    <div class="text-[92%]">
                        <div data-fill="price-unitpack" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 12: VAREJO price1 | (price2) UNIDADES POR price3 -->
    <template id="cond-12">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[70%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[80%] font-bold text-center leading-tight mb-1">
                    <span data-fill="price2-raw"></span> UNIDADES POR:
                </div>
                <div class="text-[100%]">
                    <div data-fill="price3-no-unit" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Tipo 13: VAREJO price1 | (price2)x DE price3 + texto legal (text7) -->
    <template id="cond-13">
        <div class="flex flex-col w-full items-center justify-around h-full">
            <div class="flex flex-col items-center justify-center w-1/2 px-2">
                <div class="text-[80%] font-bold text-black mb-1"></div>
                <div class="text-[60%]">
                    <div data-fill="price1" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center w-1/2 px-2 text-black">
                <div class="text-[80%] font-bold text-center leading-tight mb-1">
                    <span data-fill="price2-raw"></span>x DE:
                </div>
                <div class="text-[100%]">
                    <div data-fill="price3-no-unit" class="font-black flex flex-row items-start leading-none text-red-600"></div>
                </div>
                <div data-fill="text7" class="text-[60%] font-semibold text-center mt-1 leading-tight"></div>
            </div>
        </div>
    </template>

    <!-- Tipo 14: A PARTIR DE: price1 (sem unidade) -->
    <template id="cond-14">
        <div class="flex flex-col items-center justify-center w-full">
            <div class="text-[110%] font-black flex flex-row items-center self-start ml-5 mb-2 text-black">
                A PARTIR DE:
            </div>
            <div data-fill="price1-no-unit" class="font-black flex flex-row items-start leading-none text-red-600 animate-pulseScaleWithDelay"></div>
        </div>
    </template>

</body>
</html>
