<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/master.css">
    
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <!-- <script src="js/mock-data.js"></script> -->
    
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    
    <title>VIDEOPORTO - Tarja de Serviços</title>
</head>

<body class="m-0 p-0 w-full h-full overflow-hidden bg-black">
    <!-- Container fixo 312x100px -->
    <div id="container" class="text-[#134123]">
        <!-- Slide 1: Data e Hora -->
        <div class="slide slide-hora" data-type="hora">
            <div class="slide-row">
                <div class="slide-icon p-2" id="hora-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="hora-main">
                    <div class="hora-value" id="hora-value"></div>
                </div>
                <div class="hora-side">
                    <div class="hora-weekday" id="hora-weekday"></div>
                    <div class="hora-date" id="hora-date"></div>
                </div>
            </div>
        </div>

        <!-- Slide 2: Clima -->
        <div class="slide slide-clima" data-type="clima">
            <div class="slide-row">
                <div class="slide-icon" id="clima-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="clima-main">
                    <div class="clima-label" id="clima-condicao"></div>
                    <div class="clima-temp-line">
                        <div class="clima-temp" id="clima-temp"></div>
                        <div class="clima-unit">°C</div>
                    </div>
                </div>
                <div class="clima-metrics">
                    <div class="metric-line flex-col">Máx <span id="clima-max" class="flex"></span></div>
                    <div class="metric-line flex-col"><p>Umidade</p> <span class="metric-value-row"><span id="clima-umidade"></span></span></div>
                    <div class="metric-line flex-col">Mín <span id="clima-min" class="flex"></span></div>
                    <div class="metric-line flex-col"><p>Vento</p> <span class="metric-value-row"><span id="clima-vento"></span></span></div>
                </div>
            </div>
        </div>

        <!-- Slide 3: Tábua de Marés -->
        <div class="slide slide-mares" data-type="mares">
            <div class="slide-row">
                <div class="slide-icon" id="mares-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="mares-content">
                    <div class="mares-label">Tábua de Marés</div>
                    <div class="mares-grid">
                        <div class="quote-item">
                            <img class="quote-arrow" id="mares-seta1" src="img/seta_verde.png" alt="seta">
                            <div class="quote-value-line"><span class="quote-value" id="mares-v1"></span><span class="quote-unit">m</span></div>
                            <div class="quote-time" id="mares-h1"></div>
                        </div>
                        <div class="quote-item">
                            <img class="quote-arrow" id="mares-seta2" src="img/seta_amarala.png" alt="seta">
                            <div class="quote-value-line"><span class="quote-value" id="mares-v2"></span><span class="quote-unit">m</span></div>
                            <div class="quote-time" id="mares-h2"></div>
                        </div>
                        <div class="quote-item">
                            <img class="quote-arrow" id="mares-seta3" src="img/seta_verde.png" alt="seta">
                            <div class="quote-value-line"><span class="quote-value" id="mares-v3"></span><span class="quote-unit">m</span></div>
                            <div class="quote-time" id="mares-h3"></div>
                        </div>
                        <div class="quote-item">
                            <img class="quote-arrow" id="mares-seta4" src="img/seta_amarala.png" alt="seta">
                            <div class="quote-value-line"><span class="quote-value" id="mares-v4"></span><span class="quote-unit">m</span></div>
                            <div class="quote-time" id="mares-h4"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 4: Raios Solar (UV) -->
        <div class="slide slide-uv" data-type="uv">
            <div class="slide-row">
                <div class="slide-icon" id="uv-icon">
                    <!-- Ícone será injetado por JS -->
                </div>
                <div class="uv-main">
                    <div class="uv-title">Proteja sua pele!</div>
                    <div class="uv-msg" id="uv-msg"></div>
                </div>
            </div>
        </div>


    </div>

</body>

</html>
