<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMOBI GZH - Notícias</title>
    <link rel="stylesheet" href="css/master.css">
    <script src="js/ebhtml.js"></script>
    <script src="js/config.js"></script>
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/master.js"></script>
</head>
<body class="font-roboto-bold text-white text-[3.4vmin] portrait:text-[4.6vmin]">
    <div id="dynamicContent" class="relative w-full h-full overflow-hidden opacity-0">
        <header id="brandWrap" class="brand-wrap">
            <img id="brandLogo" class="brand-logo" alt="GZH - O meu lugar. Em qualquer lugar.">
        </header>
        <main id="cardsWrap" class="cards-wrap">
            <article id="card0" class="news-card news-card--first">
                <img id="photo0" class="photo-wrap" alt="">
                <div id="textWrap0" class="text-wrap">
                    <span id="category0" class="category-pill category-pill--first hidden"></span>
                    <p id="title0" class="news-title"></p>
                </div>
            </article>
            <article id="card1" class="news-card news-card--second hidden">
                <img id="photo1" class="photo-wrap" alt="">
                <div id="textWrap1" class="text-wrap">
                    <span id="category1" class="category-pill category-pill--second hidden"></span>
                    <p id="title1" class="news-title"></p>
                </div>
            </article>
        </main>
        <footer id="footerWrap" class="footer-wrap">
            <p id="ctaText" class="cta-text"></p>
        </footer>
    </div>
</body>
</html>
