<!DOCTYPE html>
<html lang="pt-BR" class="w-full h-full overflow-hidden ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andorinha Menuboard</title>

  <link rel="stylesheet" href="css/master.css">
  <!-- ⚠️ MOCK DATA: Descomentar linha abaixo para testes locais -->
  <!-- <script src="js/mock-data.js" defer></script> -->
  <script src="js/ebhtml.js" defer></script>
  <script src="js/master.js" defer></script>
</head>

<body class="relative w-full h-full flex-col overflow-hidden flex items-center landscape:bg-[url('../img/bg_menuboard_horizontal.jpg')] portrait:bg-[url('../img/bg_menuboard_vertical.jpg')] bg-cover font-futura-bold text-[4vmin] landscape:text-[4vmin] leading-none p-8 portrait:pt-[11vh] portrait:pb-[10vh] landscape:py-[11vh]  opacity-0 transition-opacity duration-700">

  <!-- Container Principal -->
  <div id="table-container" class="w-full mt-[10px] opacity-0 transition-opacity duration-700 portrait:h-full landscape:max-h-full flex flex-col landscape:flex-row landscape:gap-8 overflow-hidden ">

    <!-- Container de Linhas (Coluna 1 em landscape) -->
    <div id="content-rows" class="flex flex-col text-white flex-1 min-w-0 gap-4 portrait:h-full"></div>

    <!-- Container de Linhas (Coluna 2 - apenas landscape) -->
    <div id="content-rows-2" class="hidden landscape:flex flex-col text-white flex-1 min-w-0 gap-4 "></div>

    <!-- Template de linha -->
    <template id="row-template">
      <div class="flex items-stretch gap-0 portrait:gap-4 opacity-0 transform transition-opacity duration-500 w-full portrait:mb-3">
        
        <!-- Bloco Esquerdo: Descrição -->
        <div class="bloco-descricao flex-1 min-w-0 flex flex-col justify-center portrait:rounded-[2vh] landscape:rounded-s-[2vh] px-4 landscape:ps-4 landscape:min-h-[68px] portrait:h-[140px]">
          <span class="titulo font-bold leading-tight landscape:truncate"></span>
        </div>

        <!-- Bloco Direito: Preços -->
        <div class="bloco-precos bg-blue-600 portrait:rounded-[2vh] landscape:rounded-e-[2vh] landscape:-ml-[1px] flex flex-col justify-center p-4 portrait:min-w-[24vw] landscape:min-w-[6vw] items-end landscape:min-h-[68px] portrait:h-[140px]">
          <!-- Linha 1: UNID. (bebidas/portrait) + PRICE -->
          <div class="flex items-baseline gap-2 w-full justify-end portrait:justify-between">
            <span class="label-unid text-[0.70em] opacity-70 whitespace-nowrap hidden">UNID.</span>
            <span class="price font-bold"></span>
          </div>
          <!-- Linha 2: CX/N + PRICE2 (condicional, apenas portrait/bebidas) -->
          <div class="linha-price2 flex items-baseline gap-2 w-full justify-between mt-1 hidden">
            <span class="label-price2 text-[0.70em] opacity-70 whitespace-nowrap"></span>
            <span class="price2 font-bold"></span>
          </div>
        </div>
        
      </div>
    </template>

  </div>

  <!-- Rodapé dinâmico -->
  <div class="absolute bottom-0 portrait:bottom-[30px] left-0 w-full pointer-events-none">
    <!-- Landscape: rodapé com badge centralizado e frase à direita -->
    <div class="landscape:flex portrait:hidden h-[9vh] w-full items-center">
      <div class="flex-1"></div>
      <div id="badge-categoria" class="hidden items-center justify-center">
        <div id="badge-inner" class="rounded-[1.5vh] px-[3.5vw] py-[0.8vh]">
          <span id="texto-badge" class="font-futura-bold text-[4vmin] leading-none tracking-widest"></span>
        </div>
      </div>
      <div class="flex-1 flex justify-end pr-[3vw]">
        <span class="text-white text-[2.8vmin] font-futura-bold">Produtos a granel expostos diariamente</span>
      </div>
    </div>
    <!-- Portrait: card ml — preenchido via JS para menuboard_bebidas e menuboard_bebidas_269 -->
    <div id="card-ml" class="landscape:hidden hidden h-[8vh] w-full items-center justify-center">
      <div class="bg-[#e7de43] rounded-[2vh] px-[8vw] py-[1vh]">
        <span id="texto-ml" class="text-red-600 font-futura-bold text-[8vmin] leading-none"></span>
      </div>
    </div>
  </div>

</body>

</html>
