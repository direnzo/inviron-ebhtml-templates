<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Andorinha Cartaz - Supermercado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/master.css">
    
    <!-- Scripts essenciais -->
    <script src="js/ebhtml.js"></script>
    <script src="js/mock-data.js"></script> <!-- MOCK ATIVO para testes -->
    <script src="js/master.js"></script>
</head>

<body class="bg-white overflow-hidden text-black font-komika opacity-0 transition-opacity duration-500 w-screen h-screen">
    
    <!-- Background dinâmico (varia por condição) -->
    <div id="background_container" class="absolute inset-0 z-0"></div>

    <!-- Conteúdo principal -->
    <div id="fullContent" class="relative z-10 w-full h-full flex flex-col bg-white opacity-0 transition-opacity duration-300">
        
        <!-- 1. TÍTULO DO PRODUTO -->
        <div class="flex-none flex items-center justify-center w-full px-6 py-8 max-h-[22%]">
            <div id="titulo" class="text-center text-[5.5vmin] font-bold italic leading-tight uppercase"></div>
        </div>

        <!-- 2. PREÇO (construído dinamicamente via JS) -->
        <div id="price_display" class="flex-1 flex items-center justify-center w-full px-4 py-2 min-h-0"></div>

        <!-- 3. TEXTO LEGAL (rodapé) -->
        <div id="legal_text" class="flex-none text-center text-[2vmin] text-[#FF0000] font-bold px-4 py-3 leading-tight uppercase"></div>
    </div>

</body>
</html>
