<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/meteocons-helpers.js"></script>
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Previsão do Tempo</title>
</head>

<body class="relative flex flex-col h-screen w-full overflow-hidden bg-[#009ee3] font-montserrat leading-none font-bold text-white text-[3.5vmin] opacity-0 transition-opacity duration-800 ease-out">
    <!-- Fundo animado -->
    <div id="fundo" class="absolute inset-0 -z-10">
        <img src="img/fundo.jpg" class="w-full h-full object-cover" />
    </div>
    <!-- Header: cidade -->
    <header class="w-full flex h-[15vmin] items-center justify-center z-10 py-[1.5vmin]">
        <span id="cidade" class="drop-shadow text-[200%]">Cidade</span>
    </header>
    <!-- Main: cards de previsão -->
    <main class="flex h-full justify-center items-center w-full overflow-hidden">
        <div id="cards" class="flex portrait:flex-col justify-center items-center content-center gap-[2vw] w-full max-w-[96vw] h-full overflow-hidden">

            <!-- CARD 1 -->
            <div class="card flex flex-1 flex-col items-center justify-evenly content-center ls:w-[32%] w-full portrait:h-[32%] ultrawide:w-[25%] bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-1000 ease-out">

                <div class="data tracking-wider text-[200%]">--</div>
                <div class="hidden date-hour">--</div>

                <div class="flex w-full flex-col portrait:max-h-[30%] portrait:flex-row items-center gap-x-[2.5vmin]">
                    <div class="icon flex items-center justify-center min-h-0 portrait:size-[200%]"></div>

                    <div class="card-texts w-full flex flex-row items-center justify-evenly gap-[2vmin] text-[300%]">

                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-up-svg ico-svg"></span>
                            <span class="max text-orange-400 leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-down-svg ico-svg"></span>
                            <span class="min text-blue-400 leading-none">--</span>
                        </div>

                    </div>
                </div>

                <div class="extra-info-row flex flex-row portrait:flex-wrap ls:flex-col items-center justify-center w-full text-[80%] gap-x-[3vmin]">
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="chuva-icon ico-svg flex items-center"></span>
                        <span class="prob_chuva me-4">--%</span>
                        <span class="quant_chuva text-nowrap">/ --mm</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="vento-icon ico-svg flex items-center"></span>
                        <span class="quant_vento text-nowrap">--km/h</span>
                        <span class="dir-vento-svg ico-svg py-5"></span>
                        <span class="dir_vento hidden">--</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="uv-icon ico-svg flex items-center"></span>
                        <span class="indice_uv text-nowrap">UV --</span>
                        <span class="risco_uv text-nowrap">- --</span>
                    </div>
                </div>

            </div>
            <!-- CARD 2 -->
            <div class="card flex flex-1 flex-col items-center justify-evenly content-center ls:w-[32%] w-full portrait:h-[32%] ultrawide:w-[25%] bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-1000 ease-out">

                <div class="data tracking-wider text-[200%]">--</div>
                <div class="hidden date-hour">--</div>

                <div class="flex w-full flex-col portrait:max-h-[30%] portrait:flex-row items-center gap-x-[2.5vmin]">
                    <div class="icon flex items-center justify-center min-h-0 portrait:size-[200%]"></div>

                    <div class="card-texts w-full flex flex-row items-center justify-evenly gap-[2vmin] text-[300%]">

                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-up-svg ico-svg"></span>
                            <span class="max text-orange-400 leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-down-svg ico-svg"></span>
                            <span class="min text-blue-400 leading-none">--</span>
                        </div>

                    </div>
                </div>

                <div class="extra-info-row flex flex-row portrait:flex-wrap ls:flex-col items-center justify-center w-full text-[80%] gap-x-[3vmin]">
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="chuva-icon ico-svg flex items-center"></span>
                        <span class="prob_chuva me-4">--%</span>
                        <span class="quant_chuva text-nowrap">/ --mm</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="vento-icon ico-svg flex items-center"></span>
                        <span class="quant_vento text-nowrap">--km/h</span>
                        <span class="dir-vento-svg ico-svg py-5"></span>
                        <span class="dir_vento hidden">--</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="uv-icon ico-svg flex items-center"></span>
                        <span class="indice_uv text-nowrap">UV --</span>
                        <span class="risco_uv text-nowrap">- --</span>
                    </div>
                </div>

            </div>
            <!-- CARD 3 -->
            <div class="card flex flex-1 flex-col items-center justify-evenly content-center ls:w-[32%] w-full portrait:h-[32%] ultrawide:w-[25%] bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-1000 ease-out">

                <div class="data tracking-wider text-[200%]">--</div>
                <div class="hidden date-hour">--</div>

                <div class="flex w-full flex-col portrait:max-h-[30%] portrait:flex-row items-center gap-x-[2.5vmin]">
                    <div class="icon flex items-center justify-center min-h-0 portrait:size-[200%]"></div>

                    <div class="card-texts w-full flex flex-row items-center justify-evenly gap-[2vmin] text-[300%]">

                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-up-svg ico-svg"></span>
                            <span class="max text-orange-400 leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="arrow-down-svg ico-svg"></span>
                            <span class="min text-blue-400 leading-none">--</span>
                        </div>

                    </div>
                </div>

                <div class="extra-info-row flex flex-row portrait:flex-wrap ls:flex-col items-center justify-center w-full text-[80%] gap-x-[3vmin]">
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="chuva-icon ico-svg flex items-center"></span>
                        <span class="prob_chuva me-4">--%</span>
                        <span class="quant_chuva text-nowrap">/ --mm</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="vento-icon ico-svg flex items-center"></span>
                        <span class="quant_vento text-nowrap">--km/h</span>
                        <span class="dir-vento-svg ico-svg py-5"></span>
                        <span class="dir_vento hidden">--</span>
                    </div>
                    <div class="flex flex-row items-center gap-[0.3vmin]">
                        <span class="uv-icon ico-svg flex items-center"></span>
                        <span class="indice_uv text-nowrap">UV --</span>
                        <span class="risco_uv text-nowrap">- --</span>
                    </div>
                </div>

            </div>
        </div>

    </main>
    <!-- Footer: logo climatempo -->
    <footer class="w-full flex h-[15vmin] items-center justify-end p-[1.5vmin] z-10">
        <img src="img/climatempo.png" alt="Climatempo" class="h-[4vmin] max-w-[20vw] object-contain" />
    </footer>
</body>

</html>
