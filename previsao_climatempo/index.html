<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/meteocons-helpers.js"></script>
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Previsão do Tempo</title>
</head>

<body class="relative flex flex-col h-screen w-full overflow-hidden bg-[#009ee3] font-montserrat leading-none font-bold text-white text-[3vmin] opacity-0 transition-opacity duration-800">
    <!-- Fundo animado -->
    <div id="fundo" class="absolute inset-0 -z-10">
        <img src="img/fundo.jpg" class="w-full h-full object-cover" />
    </div>
    <!-- Header: cidade -->
    <header class="w-full flex flex-1 items-center justify-center z-10 py-[1.5vmin]">
        <span id="cidade" class="drop-shadow text-[8vmin]">Cidade</span>
    </header>
    <!-- Main: cards de previsão -->
    <main class="flex flex-1 justify-center items-center w-full">
        <div id="cards" class="flex flex-wrap justify-center items-center content-center gap-[2vw] w-full max-w-[96vw] h-full overflow-hidden">

            <!-- CARD 1 -->
            <div class="card flex flex-row landscape:flex-col items-center justify-between content-center landscape:h-fit bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-800 ease-out">
                <!-- Ícone principal — protagonista -->
                <!-- Em landscape: flex-1, preenche o centro do card (flex-col) -->
                <!-- Em portrait/square: flex-shrink-0, vai à esquerda (flex-row via CSS) -->
                <div class="icon flex-1 portrait:flex-[0_0_38%] w-full flex items-center justify-center min-h-0"></div>
                <!-- Bloco de textos: dia, temp, extra-info -->
                <!-- Em landscape: bloco na base do card -->
                <!-- Em portrait/square: coluna direita via CSS (display:flex flex-col) -->
                <div class="card-texts w-full flex flex-col items-center gap-[2.5vmin] landscape:-mt-[3.5vmin]">
                    <div class="data tracking-wider text-[5.5vmin] landscape:absolute landscape:top-[2%]">--</div>
                    <div class="hidden date-hour">--</div>
                    <div class="flex flex-row flex-wrap items-center justify-center gap-[0.8vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamax.png" class="h-[6vmin] w-auto" alt="Max">
                            <span class="max text-orange-400 text-[10vmin] leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamin.png" class="h-[6vmin] w-auto" alt="Min">
                            <span class="min text-blue-400 text-[10vmin] leading-none">--</span>
                        </div>
                    </div>
                    <div class="extra-info-row flex flex-row landscape:flex-col flex-wrap items-center justify-center gap-[1vmin] w-full text-[3vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="chuva-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="prob_chuva">--%</span>
                            <span class="quant_chuva text-nowrap">/ --mm</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="vento-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="quant_vento text-nowrap">--km/h</span>
                            <span class="dir-vento-svg w-[5vmin] h-[5vmin]"></span>
                            <span class="dir_vento">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="uv-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="indice_uv">UV --</span>
                            <span class="risco_uv text-nowrap">- --</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- CARD 2 -->
            <div class="card flex flex-row landscape:flex-col items-center justify-between landscape:h-fit bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-800 ease-out">
                <div class="icon portrait:flex-[0_0_38%] w-full flex items-center justify-center min-h-0"></div>
                <div class="card-texts w-full flex flex-col items-center gap-[2.5vmin] landscape:-mt-[3.5vmin]">
                    <div class="data tracking-wider text-[5.5vmin] landscape:absolute landscape:top-[2%]">--</div>
                    <div class="hidden date-hour">--</div>
                    <div class="flex flex-row flex-wrap items-center justify-center gap-[0.8vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamax.png" class="h-[6vmin] w-auto" alt="Max">
                            <span class="max text-orange-400 text-[10vmin] leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamin.png" class="h-[6vmin] w-auto" alt="Min">
                            <span class="min text-blue-400 text-[10vmin] leading-none">--</span>
                        </div>
                    </div>
                    <div class="extra-info-row flex flex-row landscape:flex-col flex-wrap items-center justify-center gap-[1vmin] w-full text-[3vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="chuva-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="prob_chuva">--%</span>
                            <span class="quant_chuva text-nowrap">/ --mm</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="vento-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="quant_vento text-nowrap">--km/h</span>
                            <span class="dir-vento-svg w-[5vmin] h-[5vmin]"></span>
                            <span class="dir_vento">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="uv-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="indice_uv">UV --</span>
                            <span class="risco_uv text-nowrap">- --</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- CARD 3 -->
            <div class="card flex flex-row landscape:flex-col items-center justify-between landscape:h-fit bg-black/80 rounded-2xl p-[1.5vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-800 ease-out">
                <div class="icon flex-1 portrait:flex-[0_0_38%] w-full flex items-center justify-center min-h-0"></div>
                <div class="card-texts w-full flex flex-col items-center gap-[2.5vmin] landscape:-mt-[3.5vmin]">
                    <div class="data tracking-wider text-[5.5vmin] landscape:absolute landscape:top-[2%]">--</div>
                    <div class="hidden date-hour">--</div>
                    <div class="flex flex-row flex-wrap items-center justify-center gap-[0.8vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamax.png" class="h-[6vmin] w-auto" alt="Max">
                            <span class="max text-orange-400 text-[10vmin] leading-none">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <img src="img/setamin.png" class="h-[6vmin] w-auto" alt="Min">
                            <span class="min text-blue-400 text-[10vmin] leading-none">--</span>
                        </div>
                    </div>
                    <div class="extra-info-row flex flex-row landscape:flex-col flex-wrap items-center justify-center gap-[1vmin] w-full text-[3vmin]">
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="chuva-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="prob_chuva">--%</span>
                            <span class="quant_chuva text-nowrap">/ --mm</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="vento-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="quant_vento text-nowrap">--km/h</span>
                            <span class="dir-vento-svg w-[5vmin] h-[5vmin]"></span>
                            <span class="dir_vento">--</span>
                        </div>
                        <div class="flex flex-row items-center gap-[0.3vmin]">
                            <span class="uv-icon flex items-center w-[5vmin] h-[5vmin]"></span>
                            <span class="indice_uv">UV --</span>
                            <span class="risco_uv text-nowrap">- --</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <!-- Footer: logo climatempo -->
    <footer class="w-full flex flex-1 justify-end p-[1.5vmin] z-10">
        <img src="img/climatempo.png" alt="Climatempo" class="h-[4vmin] max-w-[20vw] object-contain" />
    </footer>
</body>

</html>
