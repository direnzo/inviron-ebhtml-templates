<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/meteocons-helpers.js"></script>
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Previsão do Tempo</title>
</head>

<body class="relative flex flex-col h-screen w-full overflow-hidden bg-[#009ee3] font-montserrat leading-none font-bold text-white text-[3.5vmin] opacity-0 transition-opacity duration-800 ease-out">
    <!-- Fundo animado -->
    <div id="fundo" class="absolute inset-0 -z-10">
        <img src="img/fundo.jpg" class="w-full h-full object-cover" />
    </div>
    <!-- Header: cidade -->
    <header class="w-full flex h-[15vmin] items-center justify-center z-10 py-[1.5vmin]">
        <span id="cidade" class="drop-shadow text-[200%]">Cidade</span>
    </header>
    <!-- Main: cards de previsão -->
    <main class="flex h-full justify-center items-center w-full overflow-hidden p-[2vmin]">
        <div id="cards" class="flex portrait:flex-col justify-center items-stretch content-center gap-[2vmin] w-full h-full overflow-hidden">
            <!-- Cards serão inseridos dinamicamente via JS -->
        </div>
    </main>
    
    <!-- Template de card reutilizável -->
    <template id="card-template">
        <div class="card flex flex-1 min-w-0 rounded-2xl flex-col items-center justify-between portrait:min-h-0 bg-black/80 p-[1.8vmin] shadow-lg -translate-x-[120%] opacity-0 transition-all duration-1000 ease-out gap-[1vmin]">

            <div class="data tracking-wider text-[min(5vmin,2em)] portrait:text-[min(4vmin,1.8em)] leading-tight flex-shrink-0">--</div>
            <div class="hidden date-hour">--</div>

            <!-- Container do ícone + temperaturas com flex dinâmico -->
            <div class="flex w-full flex-row ls:flex-col ultrawide:flex-col empena:flex-col items-center justify-center gap-[1vmin] flex-1 min-h-0 overflow-hidden">
                <!-- Ícone principal com tamanho responsivo (viewBox ajustado automaticamente no JS) -->
                <div class="icon flex items-center justify-center w-full min-w-[15vmin] max-w-[28vmin] portrait:max-w-[24vmin] aspect-square flex-shrink"></div>

                <!-- Temperaturas com tamanho escalável -->
                <div class="card-texts flex flex-row items-center justify-center gap-[3vmin] portrait:gap-[2vmin] text-[min(7vmin,3.5em)] portrait:text-[min(9vmin,3em)] flex-shrink-0">
                    <div class="flex flex-row items-center justify-center gap-[0.5vmin]">
                        <span class="arrow-up-svg w-[1.2em] h-[1.2em] flex-shrink-0"></span>
                        <span class="max text-orange-400 leading-none whitespace-nowrap">--</span>
                    </div>
                    <div class="flex flex-row items-center justify-center gap-[0.5vmin]">
                        <span class="arrow-down-svg w-[1.2em] h-[1.2em] flex-shrink-0"></span>
                        <span class="min text-blue-400 leading-none whitespace-nowrap">--</span>
                    </div>
                </div>
            </div>

            <!-- Informações extras com texto menor e responsivo -->
            <div class="extra-info-row flex flex-row flex-wrap items-center justify-center w-full text-[min(2.8vmin,0.9em)] portrait:text-[min(2.5vmin,0.85em)] gap-x-[2vmin] gap-y-[0.5vmin] leading-tight flex-shrink-0">
                <div class="flex flex-row items-center gap-[0.4vmin] whitespace-nowrap">
                    <span class="chuva-icon w-[1.5em] h-[1.5em] flex items-center flex-shrink-0"></span>
                    <span class="prob_chuva">--%</span>
                    <span class="quant_chuva">/--mm</span>
                </div>
                <div class="flex flex-row items-center gap-[0.4vmin] whitespace-nowrap">
                    <span class="vento-icon w-[1.5em] h-[1.5em] flex items-center flex-shrink-0"></span>
                    <span class="quant_vento">--km/h</span>
                    <span class="dir-vento-svg w-[1.5em] h-[1.5em] flex-shrink-0"></span>
                    <span class="dir_vento hidden">--</span>
                </div>
                <div class="flex flex-row items-center gap-[0.4vmin] whitespace-nowrap">
                    <span class="uv-icon w-[1.5em] h-[1.5em] flex items-center flex-shrink-0"></span>
                    <span class="indice_uv">UV--</span>
                    <span class="risco_uv">---</span>
                </div>
            </div>

        </div>
    </template>
    <!-- Footer: logo climatempo -->
    <footer class="w-full flex h-[15vmin] items-center justify-end p-[1.5vmin] z-10">
        <img src="img/climatempo.png" alt="Climatempo" class="h-[4vmin] max-w-[20vw] object-contain" />
    </footer>
</body>

</html>
