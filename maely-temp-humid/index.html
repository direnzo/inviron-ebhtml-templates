<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">

    <!-- Mock data para desenvolvimento (comentar em producao) -->
    <script src="js/mock-data.js"></script>

    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Temperatura e Umidade - Maely</title>
</head>

<body class="relative h-screen w-full overflow-hidden bg-[#2f2f2f] opacity-0 transition-opacity duration-700">

    <!-- Slide 1: Temperatura -->
    <div id="slide-temp" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-[5vw]">

            <!-- Label -->
            <span class="text-white font-black text-[3.5vw] whitespace-nowrap tracking-tight">Temperatura</span>

            <!-- Icone Termometro (SVG inline) -->
            <svg class="flex-shrink-0 w-[3vw] h-[8vw]" viewBox="0 0 30 82" xmlns="http://www.w3.org/2000/svg">
                <!-- Tubo externo (fundo) -->
                <rect x="9" y="0" width="12" height="55" rx="6" fill="rgba(255,255,255,0.25)"/>
                <!-- Mercurio interno -->
                <rect x="12" y="22" width="6" height="35" rx="3" fill="white"/>
                <!-- Bulbo -->
                <circle cx="15" cy="68" r="13" fill="white"/>
                <!-- Marcacoes de temperatura -->
                <line x1="21" y1="14" x2="28" y2="14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="21" y1="25" x2="28" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="21" y1="36" x2="28" y2="36" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="21" y1="47" x2="28" y2="47" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>

            <!-- Valor + Unidade -->
            <div class="flex items-baseline gap-[1vw]">
                <span id="temp-value" class="text-white font-black text-[16vw] leading-none tracking-tight">--.-</span>
                <span class="text-white font-black text-[8vw] leading-none">&#xB0;C</span>
            </div>

        </div>
    </div>

    <!-- Slide 2: Umidade do ar -->
    <div id="slide-humid" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-[5vw]">

            <!-- Label (duas linhas) -->
            <span class="text-white font-black text-[3.5vw] text-right leading-tight tracking-tight">Umidade<br>do ar</span>

            <!-- Icone Umidade (SVG inline) -->
            <svg class="flex-shrink-0 w-[9vw] h-[9vw]" viewBox="0 0 62 62" xmlns="http://www.w3.org/2000/svg">
                <!-- Drop grande (esquerda/centro) -->
                <path d="M18,0 C25,14 32,21 32,28 A14,14 0 1 1 4,28 C4,21 11,14 18,0 Z" fill="#5ba3c8"/>
                <!-- Drop pequeno (direita) -->
                <path d="M44,6 C49,16 54,21 54,27 A10,10 0 1 1 34,27 C34,21 39,16 44,6 Z" fill="rgba(91,163,200,0.7)"/>
                <!-- Onda 1 -->
                <path d="M0,48 Q8,44 16,48 Q24,52 32,48 Q40,44 48,48 Q56,44 62,47" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <!-- Onda 2 -->
                <path d="M0,57 Q8,53 16,57 Q24,61 32,57 Q40,53 48,57 Q56,53 62,56" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </svg>

            <!-- Valor + Unidade -->
            <div class="flex items-baseline gap-[0.5vw]">
                <span id="humid-value" class="text-white font-black text-[16vw] leading-none tracking-tight">--</span>
                <span class="text-white font-black text-[8vw] leading-none">%</span>
            </div>

        </div>
    </div>

    <!-- Estado de erro -->
    <div id="error-state" class="hidden absolute inset-0 items-center justify-center">
        <p class="text-white font-bold text-[4vw] opacity-50">Dados indispon&#237;veis</p>
    </div>

</body>

</html>
