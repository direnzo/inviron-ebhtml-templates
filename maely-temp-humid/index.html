<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">

    <!-- Mock data para desenvolvimento (comentar em producao) -->
    <!-- <script src="js/mock-data.js"></script> -->

    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Temperatura e Umidade - Maely</title>
</head>

<body class="relative h-screen w-full overflow-hidden bg-[#2f2f2f] opacity-0 transition-opacity duration-700">

    <!-- Slide 1: Temperatura -->
    <div id="slide-temp" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-[4vw]">

            <!-- Label -->
            <span class="text-white font-helvetica-heavy text-[5.5vw] whitespace-nowrap">Temperatura</span>

            <!-- Icone + Valor (agrupados) -->
            <div class="flex items-center gap-[1.5vw]">
                <img src="img/term.png" class="flex-shrink-0 h-[12vw] w-auto object-contain" alt="temperatura">
                <div class="flex items-baseline gap-[1vw]">
                    <span id="temp-value" class="text-white font-helvetica-heavy text-[10vw] leading-none">--.-</span>
                    <span class="text-white font-helvetica-heavy text-[10vw] leading-none">&#xB0;C</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Slide 2: Umidade do ar -->
    <div id="slide-humid" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-[4vw]">

            <!-- Label (duas linhas) -->
            <span class="text-white font-helvetica-heavy text-[5.5vw] text-right leading-tight">Umidade<br>do ar</span>

            <!-- Icone + Valor (agrupados) -->
            <div class="flex items-center gap-[1.5vw]">
                <img src="img/gota.png" class="flex-shrink-0 h-[15vw] w-auto object-contain" alt="umidade">
                <div class="flex items-baseline gap-[0.5vw]">
                    <span id="humid-value" class="text-white font-helvetica-heavy text-[15vw] leading-none">--</span>
                    <span class="text-white font-helvetica-heavy text-[15vw] leading-none">%</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Estado de erro -->
    <div id="error-state" class="hidden absolute inset-0 items-center justify-center">
        <p class="text-white font-bold text-[4vw] opacity-50">Dados indispon&#237;veis</p>
    </div>

</body>

</html>
