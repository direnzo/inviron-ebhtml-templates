<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo - CPTEC</title>
    <link rel="stylesheet" href="css/master.css">
    <script src="js/ebhtml.js"></script>
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/master.js"></script>
</head>

<!--
  Breakpoints (tailwind.config.js):
    portrait    max-aspect-ratio: 3/4  → cards em coluna, card vira flex-row
    superbanner min-aspect-ratio: 5/1  → body vira grid 5 colunas (1 linha)
  Tipografia: vmin em tudo — escala automática, sem breakpoints de fonte.
-->

<body class="bg-[#0D2245] text-white font-montserrat font-bold w-full h-full overflow-hidden
             flex flex-col superbanner:grid superbanner:grid-cols-[auto_1fr_1fr_1fr_auto]
             opacity-0 transition-opacity duration-[1000ms]">

    <!-- Fundo -->
    <div class="absolute inset-0 overflow-hidden -z-0">
        <img src="img/fundo.jpg" alt="" class="w-full h-full object-cover">
    </div>

    <!-- HEADER — cidade -->
    <header class="relative z-10 h-[12%] superbanner:h-full
                   flex items-center justify-center
                   opacity-0 animate-fade-in" style="animation-delay:0.5s">
        <p id="cidade" class="text-[5vmin] text-center leading-none tracking-wide"></p>
    </header>

    <!-- MAIN — 3 cards -->
    <!-- items-stretch (padrão flex) faz os cards ocuparem 100% da altura do main -->
    <main class="relative z-10 flex-1 superbanner:contents
                 flex flex-row portrait:flex-col
                 portrait:items-center justify-center
                 gap-[2%] p-[2%]">
        <!-- Cards gerados pelo JS -->
        <div id="cards-container" class="contents"></div>
    </main>

    <!-- FOOTER — logo -->
    <footer class="relative z-10 h-[10%] superbanner:h-full
                   flex items-center justify-end
                   pr-[2%] pb-[1%] superbanner:pb-0
                   opacity-0 animate-fade-in" style="animation-delay:1s">
        <img src="img/logo_CPTEC.png" alt="CPTEC"
             class="h-[70%] superbanner:h-[60%] w-auto object-contain max-w-[20vmin]">
    </footer>

</body>

</html>
