<!DOCTYPE html>
<html lang="pt-br" class="bg-black h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canaltech</title>
    <link rel="stylesheet" href="css/master.css">
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
</head>

<body class="relative h-full w-full overflow-hidden opacity-0 transition-opacity duration-1000 text-[3vw]  text-white
    square:text-[3.4vw]
    portrait:text-[3.8vh] 
    ultrawide:text-[10vh]
    superbanner:text-[15vh] superbanner:leading-tight
    footer:text-[30vh] footer:leading-tight
    empena:!text-[2vh] empena:leading-relaxed">
    <header id="header" class="absolute top-0 left-0 w-full h-[8vh] pt-10 flex items-start justify-center z-20 bg-gradient-to-bl from-black to-50% to-transparent">
        <div id="headerContent" class="flex items-center justify-between w-full h-auto max-w-[95vw]">
            <div id="headerText" class="text-white font-bold text-[70%]"></div>
            <img id="headerLogo" src="img/logo.png" alt="logo"
                class="max-w-[25vw] object-contain object-center
                ultrawide:max-w-[10vw]
                superbanner:max-w-[15vw]">
        </div>
    </header>


     <main id="main" class="absolute flex flex-col w-full h-full min-h-screen z-10
         ultrawide:!flex-row ultrawide:items-stretch
         portrait:flex-col
         landscape:flex-col">

        <!-- FOTO -->
        <div id="photoContainer" class="overflow-hidden w-full h-full flex items-center justify-center
           ultrawide:w-2/3 ultrawide:h-full 
           square:!h-full
           portrait:h-2/3
           superbanner:w-full superbanner:justify-between
           footer:hidden">
            <img id="image" src="" alt="image" class="h-full w-full max-w-full max-h-full object-cover bg-no-repeat transition-all ease-linear duration-[15000ms] 
                superbanner:w-1/3 
                portrait:object-left
                empena:object-left">
            <img id="image2" src="" alt="image" class="hidden h-full w-full max-w-full max-h-full object-cover transition-all ease-linear duration-[15000ms]
                superbanner:w-1/3 superbanner:block">
        </div>

        <!-- BOX CONTEUDO -->
        <div id="textContainer" class="absolute bottom-0 z-20 w-full h-[65vh] pt-[35vh] flex flex-col justify-start px-0
           bg-gradient-to-t from-black from-10% to-transparent
           square:pt-[38vh]
           landscape:pt-[32vh]
           portrait:from-50% portrait:pt-[35vh]
           ultrawide:w-[80vw] ultrawide:h-full ultrawide:ps-[30vw] ultrawide:pt-0 ultrawide:justify-center ultrawide:right-0 ultrawide:bg-gradient-to-l ultrawide:from-50%
           superbanner:w-full superbanner:px-[25vw] superbanner:bg-[linear-gradient(90deg,_transparent_0%,_black_30%,_black_70%,_transparent_100%)]
           footer:w-full footer:ps-0 footer:flex-row footer:justify-center footer:items-center footer:h-full">

            <!-- Editoria -->
            <div class="mb-[1.5vh]">
                <div id="titleContainer" class="inline-flex items-center rounded-r-full pl-[3vw] pr-[3vw] py-[0.8vh] whitespace-nowrap bg-sky-500
                footer:px-[2vw]">
                    <div id="title" class="font-bold font-poppins-bold"></div>
                </div>
            </div>
            <!-- Descrição -->
            <div id="descriptionContainer" class="flex-1 h-full flex items-center justify-center px-[3vw] py-[2vh] overflow-hidden">
                <div id="description" class="text-left font-poppins-medium ps-[2%] overflow-hidden"></div>
            </div>
        </div>
    </main>

    <!-- Créditos -->
    <footer id="credit" class="hidden absolute z-40 left-5 top-1/2 transform -translate-y-1/2 rotate-[-90deg] origin-left text-[30%]
        md:block
        portrait:top-1/3 
        ultrawide:top-1/2
        footer:!hidden">
    </footer>

</body>

</html>
