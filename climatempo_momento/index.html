<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">

    <!-- CONFIG_CLIMA — deve vir antes de todos os scripts -->
    <script>
        var CONFIG_CLIMA = {
            iconStyle: 'fill', // 'fill' | 'flat' | 'line' | 'monochrome'
            iconColor: '#ffffff', // só funciona com o estilo 'monochrome'
            textColor: '#ffffff', // cor do texto (opcional)
            duration: 10000,

            // Sponsor (D_SPD)
            sponsorEnabled: false, // habilita leitura de D_SPD
            sponsorRandomTest: false, // alterna sponsor true/false a cada load (teste)
            sponsorPrerollEnabled: false // exibe FILE_IMAGE1..N antes do conteúdo principal
        };
    </script>

    <!-- Mock data (comentar em producao) -->
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/meteocons-helpers.js"></script>
    <script src="js/weather-video.js"></script>

    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Climatempo Momento</title>
</head>

<body class="relative flex flex-col h-screen w-full overflow-hidden font-google-sans-flex leading-none text-[5vmin] superbanner:text-[8vmin] opacity-0 transition-opacity duration-800 ease-out">

    <div id="weather-background" class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <video id="weather-video" autoplay muted loop playsinline preload="auto" class="absolute inset-0 w-full h-full object-cover"></video>
    </div>

    <!-- Pré-roll D_SPD (mídia fullscreen antes do conteúdo) -->
    <div id="spdPreroll" class="hidden fixed inset-0 z-[9999] bg-black items-center justify-center">
        <img id="spdPrerollImage" class="hidden w-full h-full object-contain bg-black" src="" alt="Mídia patrocinador" />
        <video id="spdPrerollVideo" class="hidden w-full h-full object-contain bg-black" muted playsinline webkit-playsinline preload="auto"></video>
    </div>

    <!-- Header: cidade -->
    <header class="w-full flex h-[15vmin] items-center justify-center z-10 py-[2.5vmin] bg-gradient-to-b from-slate-900 via-slate-950/60">
        <span id="cidade" class="drop-shadow-text text-[200%] tracking-wider  rounded-xl px-[3vmin] py-[1vmin] ">--</span>
    </header>

    <!-- Main: conteudo central -->
    <main class="flex-1 flex items-center justify-center w-[98vw] portrait:w-[96vw] square:w-[96vw] overflow-hidden p-[2vmin] z-10 bg-slate-900/40 backdrop-blur-2xl backdrop-fallback rounded-[2vmin] mx-[2vmin]">
        <div id="content" class="flex portrait:flex-col items-center justify-center space-y-[2vmin] ls:space-y-0 ls:space-x-[2vmin] ultrawide:space-y-0 ultrawide:space-x-[2vmin] superbanner:space-y-0 superbanner:space-x-[2vmin] w-full h-full
                    ls:flex-row ultrawide:flex-row superbanner:flex-row">

            <!-- Icone grande -->
            <div id="icon-area" class="flex items-center justify-center
                        portrait:w-full portrait:h-auto portrait:max-h-[40%]
                        ls:w-[45%] ls:h-full
                        ultrawide:w-[40%] ultrawide:h-full">
                <div id="main-icon" class="w-full h-full min-w-[20vmin] max-w-[50vmin] portrait:max-w-[40vmin] aspect-square flex-shrink-0 drop-shadow-text"></div>
            </div>

            <!-- Informacoes -->
            <div id="info-area" class="flex flex-col items-center justify-center space-y-[3.5vmin]
                        portrait:w-full portrait:h-auto
                        ls:h-full
                        ultrawide:h-full">

                <!-- Temperatura -->
                <div id="temp-main" class="text-[450%] portrait:text-[400%] leading-none drop-shadow-text">--°</div>

                <!-- Descricao -->
                <div id="descricao" class="text-[80%] text-center portrait:text-[120%] opacity-90 drop-shadow-text">--</div>

                <!-- Sensacao termica -->
                <div id="sensacao" class="hidden text-[80%] portrait:text-[120%] opacity-90 drop-shadow-text">--</div>

                <!-- Umidade + Vento -->
                <div id="extra-row" class="flex flex-row items-center justify-center space-x-[3vmin] text-[90%]  mt-[1vmin] drop-shadow-text backdrop:blur-[1.5px] bg-slate-900/20 rounded-[1vmin] p-[1.5vmin]">

                    <!-- Umidade -->
                    <div class="flex flex-col items-center space-y-[0.8vmin]">
                        <span id="humidity-title" class="text-[50%]">Umidade</span>
                        <div class="flex flex-row items-center space-x-[0.8vmin]">
                            <span id="humidity-icon" class="w-[1.4em] h-[1.4em] flex items-center flex-shrink-0"></span>
                            <span id="humidity-value" class="whitespace-nowrap">--%</span>
                        </div>
                    </div>

                    <!-- Vento -->
                    <div class="flex flex-col items-center space-y-[0.8vmin]">
                        <span id="wind-title" class="text-[50%] ">Vento</span>
                        <div id="windir" class="flex flex-row items-center space-x-[0.8vmin] ">
                            <div class="flex flex-row items-center space-x-[0.8vmin]">
                                <span id="wind-icon" class="w-[1.4em] h-[1.4em] flex items-center flex-shrink-0"></span>
                                <span id="wind-value" class="whitespace-nowrap ">--km/h</span>
                            </div>
                            <div class="flex flex-row items-center space-x-[0.8vmin]">
                                <span id="wind-dir-icon" class="w-[0.8em] h-[0.8em] flex items-center flex-shrink-0"></span>
                                <span id="wind-dir-text" class="text-[70%] font-light whitespace-nowrap opacity-70"></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer: logo climatempo -->
    <footer class="w-full flex h-[10vmin] items-center justify-between p-[1.5vmin] z-10 bg-black/40 backdrop-blur-2xl backdrop-fallback">
        <div id="sponsorBox" class="hidden flex items-center justify-start space-x-[1.2vmin] max-w-[70vw]">
            <!-- <span id="sponsorTag" class="text-[45%] tracking-wide opacity-80">PATROCINADO</span> -->
            <span id="sponsorText" class="text-[60%] whitespace-nowrap overflow-hidden text-ellipsis max-w-[36vw] hidden"></span>
            <img id="sponsorLogo" src="" alt="Patrocinador" class="h-[4vmin] max-w-[24vw] object-contain hidden" />
        </div>
        <img id="climatempoLogo" src="img/climatempo.png" alt="Climatempo" class="h-[4vmin] max-w-[20vw] object-contain" />
    </footer>

</body>
</html>
