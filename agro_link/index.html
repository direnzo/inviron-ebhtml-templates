<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">
    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>AgroLink - Notícias</title>
</head>

<body class="relative h-screen w-full overflow-hidden bg-black text-white font-mmc-medium text-[8vmin] opacity-0 transition-opacity duration-1000">
    <!-- Background principal -->
    <div id="bg-main" class="absolute inset-0 w-full h-full z-0">
        <!-- Portrait background -->
        <img src="img/fundo_agrolink_port.jpg" class="absolute inset-0 w-full h-full object-cover block portrait:block landscape:hidden" alt="Fundo AgroLink Portrait" />
        <!-- Landscape background -->
        <img src="img/fundo_agrolink_land.jpg" class="absolute inset-0 w-full h-full object-cover hidden landscape:block portrait:hidden" alt="Fundo AgroLink Landscape" />
    </div>
    <div id="content" class="flex items-center justify-center w-full h-full relative z-10 p-[5vmin]">
        <!-- Conteúdo dinâmico -->
    </div>

    <template id="noticia-template">
        <div id="main-card" class="flex flex-col portrait:flex-col landscape:flex-row w-full h-full bg-black/80 rounded-[3vmin] overflow-hidden">
            <!-- Bloco de conteúdo -->
            <div class="bloco-conteudo flex-1 flex flex-col justify-between p-[4vmin] bg-black/85">
                <div id="badge" class="inline-block px-[3.5vmin] pt-[2vmin] pb-[2.5vmin] rounded-[2vmin] landscape:rounded-full w-fit bg-white text-black mb-[10vmin] text-[60%] leading-none ">CIDADE, UF</div>

                <!-- NOTÍCIAS -->
                <div id="bloco-noticia" class="categoria-bloco flex h-full items-center justify-center h-full border-b-[1px] border-t-[1px] border-white hidden">
                    <div id="titulo" class="titulo-principal  leading-tight my-auto ">TÍTULO DA NOTÍCIA</div>
                </div>

                <!-- DÓLAR -->
                <div id="bloco-dolar" class="categoria-bloco flex h-full items-center justify-center h-full border-b-[1px] border-t-[1px] border-white hidden">
                    <div class="flex flex-col gap-[2vmin] items-center justify-center h-full">
                        <div id="titulo-dolar" class="titulo-principal  leading-tight">TÍTULO DÓLAR</div>
                        <div class="flex gap-[3vmin] items-end justify-center">
                            <span id="valor-dolar" class="text-[7vmin] font-bold ">R$ 0,00</span>
                            <span id="variacao-dolar" class="text-[4vmin] font-bold text-green-400 mb-[1vmin]">+0,00%</span>
                        </div>
                    </div>
                </div>

                <!-- TEMPO -->
                <div id="bloco-tempo" class="categoria-bloco flex h-full items-center border-b-[1px] border-t-[1px] border-white hidden">
                    <div class="flex flex-col gap-[2vmin] items-center justify-center h-full">
                        <div id="titulo-tempo" class="leading-tight text-[80%]">TÍTULO TEMPO</div>
                        <div class="flex gap-[3vmin] items-start justify-center">
                            <span class="flex items-center gap-[1vmin]">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[6vmin] h-[6vmin] text-blue-300"><path d="M12 16.5c-.28 0-.53-.11-.71-.29l-5-5a1.003 1.003 0 011.42-1.42L12 13.59l4.29-4.3a1.003 1.003 0 011.42 1.42l-5 5c-.18.18-.43.29-.71.29z"/></svg>
                                <span id="temp-min" class=" font-bold">17°C</span>
                            </span>
                            <span class="flex items-center gap-[1vmin]">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[6vmin] h-[6vmin] text-red-300 rotate-180"><path d="M12 16.5c-.28 0-.53-.11-.71-.29l-5-5a1.003 1.003 0 011.42-1.42L12 13.59l4.29-4.3a1.003 1.003 0 011.42 1.42l-5 5c-.18.18-.43.29-.71.29z"/></svg>
                                <span id="temp-max" class=" font-bold">31°C</span>
                            </span>
                        </div>
                        <div class="flex gap-[3vmin] items-center justify-center text-[30%]">
                            <span id="probchuva" class="">Probabilidade de Chuva: 0</span>
                            <span id="qtdchuva" class="">Qtd de Chuva: 0</span>
                            <span id="umidade" class="">Umidade: 31%</span>
                            <span id="vento" class="">Vento: 4 km/h Leste</span>
                        </div>

                    </div>
                </div>


                <!-- COTAÇÕES -->
                <div id="bloco-cotacoes" class="categoria-bloco flex h-full items-center border-b-[1px] border-t-[1px] border-white hidden">
                    <div class="flex flex-col gap-[1vmin] items-start justify-center h-full w-full">
                        <div id="titulo-cotacoes" class="leading-none text-[110%]">TÍTULO COTAÇÃO</div>
                        <div id="classificacao-cotacoes" class=" text-[70%] font-mmc-regular">DESCRiÇÃO</div>
                        <div id="valor-cotacoes" class="leading-none text-[110%]">VALOR COTAÇÃO</div>
                        <div id="obs-cotacoes" class="text-[40%] font-mmc-regular">Obs</div>
                    </div>
                </div>

                <div class="w-full flex items-center justify-between mt-[6vmin]  mb-[3vmin] text-[50%]">
                    <span id="assinatura">
                        <span class="text-[#FF2323] ">TRITONEWS</span> <span class="">BY AGROLINK</span>
                    </span>
                </div>
            </div>
            <!-- Bloco da foto -->
            <div class="bloco-foto flex-1 flex items-end justify-center relative overflow-hidden">
                <video id="video-foto" class="object-cover w-full h-full" autoplay loop muted playsinline>
                    <source src="img/triton.mp4" type="video/mp4" />
                </video>
                <!-- Vinheta gradiente -->
                <div class="absolute inset-0 w-full h-full pointer-events-none z-10" style="background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.0) 70%, rgba(0,0,0,0.65) 100%);">
                </div>
                <!-- Imagem topo -->
                <div class="absolute top-0 left-0 w-full flex justify-center pointer-events-none z-20">
                    <img src="img/all_new.png" class="w-[40vmin] max-w-[80%] h-auto mt-[2vmin]" alt="All New Triton" />
                </div>
                <!-- Imagem base -->
                <div class="absolute bottom-0 left-0 w-full flex justify-center pointer-events-none z-20">
                    <img src="img/logo.png" class="w-[20vmin] max-w-[60%] h-auto mb-[2vmin]" alt="Logo Mitsubishi" />
                </div>
            </div>
        </div>
    </template>
</body>

</html>
