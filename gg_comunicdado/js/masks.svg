<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">

<defs>

<!-- ========================= -->
<!-- 1–10 Formas Básicas -->
<!-- ========================= -->

<clipPath id="mask-circle" clipPathUnits="objectBoundingBox">
  <circle cx="0.5" cy="0.5" r="0.5"/>
</clipPath>

<clipPath id="mask-ellipse">
  <ellipse cx="50%" cy="50%" rx="50%" ry="40%"/>
</clipPath>

<clipPath id="mask-rounded-square">
  <rect x="0" y="0" width="1" height="1" rx="0.2"/>
</clipPath>

<clipPath id="mask-pill-horizontal">
  <rect x="0" y="0.25" width="1" height="0.5" rx="0.25"/>
</clipPath>

<clipPath id="mask-pill-vertical">
  <rect x="0.25" y="0" width="0.5" height="1" rx="0.25"/>
</clipPath>

<clipPath id="mask-corner-cut">
  <polygon points="0.1,0 1,0 1,1 0,1 0,0.1"/>
</clipPath>

<clipPath id="mask-diagonal">
  <polygon points="0,0 1,0 0.8,1 0,1"/>
</clipPath>

<clipPath id="mask-triangle">
  <polygon points="0.5,0 1,1 0,1"/>
</clipPath>

<clipPath id="mask-diamond">
  <polygon points="0.5,0 1,0.5 0.5,1 0,0.5"/>
</clipPath>

<clipPath id="mask-trapezoid">
  <polygon points="0.2,0 0.8,0 1,1 0,1"/>
</clipPath>

<!-- ========================= -->
<!-- 11–20 Polígonos -->
<!-- ========================= -->

<clipPath id="mask-pentagon">
  <polygon points="0.5,0 1,0.38 0.82,1 0.18,1 0,0.38"/>
</clipPath>

<clipPath id="mask-hexagon">
  <polygon points="0.25,0 0.75,0 1,0.5 0.75,1 0.25,1 0,0.5"/>
</clipPath>

<clipPath id="mask-octagon">
  <polygon points="0.3,0 0.7,0 1,0.3 1,0.7 0.7,1 0.3,1 0,0.7 0,0.3"/>
</clipPath>

<clipPath id="mask-parallelogram">
  <polygon points="0.2,0 1,0 0.8,1 0,1"/>
</clipPath>

<clipPath id="mask-chevron">
  <polygon points="0,0 0.7,0 1,0.5 0.7,1 0,1 0.3,0.5"/>
</clipPath>

<clipPath id="mask-arrow-right">
  <polygon points="0,0 0.7,0 1,0.5 0.7,1 0,1"/>
</clipPath>

<clipPath id="mask-cross">
  <polygon points="0.4,0 0.6,0 0.6,0.4 1,0.4 1,0.6 0.6,0.6 0.6,1 0.4,1 0.4,0.6 0,0.6 0,0.4 0.4,0.4"/>
</clipPath>

<clipPath id="mask-star-5">
  <polygon points="0.5,0 0.61,0.35 1,0.35 0.68,0.57 0.8,1 0.5,0.75 0.2,1 0.32,0.57 0,0.35 0.39,0.35"/>
</clipPath>

<clipPath id="mask-burst">
  <polygon points="0.5,0 0.6,0.3 1,0.5 0.6,0.7 0.5,1 0.4,0.7 0,0.5 0.4,0.3"/>
</clipPath>

<clipPath id="mask-gear">
  <polygon points="0.5,0 0.6,0.15 0.8,0.1 0.85,0.3 1,0.4 0.9,0.6 0.85,0.8 0.65,0.85 0.5,1 0.35,0.85 0.15,0.8 0.1,0.6 0,0.4 0.15,0.3 0.2,0.1 0.4,0.15"/>
</clipPath>

<!-- ========================= -->
<!-- 21–35 Orgânicas -->
<!-- ========================= -->

<clipPath id="mask-wave">
  <path d="M0,0.7 C0.2,0.9 0.4,0.5 0.6,0.7 C0.8,0.9 1,0.6 1,0.6 L1,1 L0,1 Z"/>
</clipPath>

<clipPath id="mask-blob-1">
  <path d="M0.3,0.1 C0.6,-0.1 1,0.3 0.8,0.7 C0.6,1 0.2,0.9 0.1,0.5 C0,0.3 0.1,0.2 0.3,0.1 Z"/>
</clipPath>

<clipPath id="mask-blob-2">
  <path d="M0.2,0.2 C0.5,0 0.9,0.2 0.9,0.6 C0.8,1 0.3,1 0.1,0.6 C0,0.4 0.1,0.3 0.2,0.2 Z"/>
</clipPath>

<clipPath id="mask-heart">
  <path d="M0.5,0.9 L0.1,0.5 C0,0.3 0.2,0.1 0.4,0.2 C0.5,0.3 0.5,0.3 0.6,0.2 C0.8,0.1 1,0.3 0.9,0.5 Z"/>
</clipPath>

<clipPath id="mask-cloud">
  <path d="M0.2,0.7 C0,0.6 0.1,0.4 0.3,0.4 C0.3,0.2 0.6,0.2 0.7,0.4 C0.9,0.3 1,0.5 0.9,0.7 Z"/>
</clipPath>

<!-- ========================= -->
<!-- 36–50 Layout / Split -->
<!-- ========================= -->

<clipPath id="mask-half-left">
  <rect x="0" y="0" width="0.5" height="1"/>
</clipPath>

<clipPath id="mask-half-right">
  <rect x="0.5" y="0" width="0.5" height="1"/>
</clipPath>

<clipPath id="mask-diagonal-split">
  <polygon points="0,0 1,0 0,1"/>
</clipPath>

<clipPath id="mask-quarter-circle">
  <path d="M0,0 L1,0 A1,1 0 0 1 0,1 Z"/>
</clipPath>

<clipPath id="mask-frame">
  <rect x="0.1" y="0.1" width="0.8" height="0.8"/>
</clipPath>

</defs>
</svg>