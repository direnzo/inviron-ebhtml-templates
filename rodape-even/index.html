<!DOCTYPE html>
<html lang="pt-br" class="h-full w-full overflow-hidden bg-gray-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/master.css">
    <script src="js/config.js"></script>
    <script src="js/modules/modulo-clima.js"></script>
    <script src="js/modules/modulo-financeiro.js"></script>
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Rodape</title>
</head>

<body class="w-full h-full overflow-hidden font-poppins-medium text-[20vmin] px-[20vmin] pb-[15vmin]">
    <div id="rodape-bar" class="flex flex-row items-center w-full h-full overflow-hidden box-border px-[20vmin] gap-[2vmin] bg-white/90 rounded-2xl">
        <div id="col-logo" class="flex items-center justify-center h-full flex-shrink min-w-0 max-w-[20vw] p-0">
            <img id="logo-img" class="h-[80%] w-auto object-contain block" src="" alt="">
        </div>
        <div id="divider-1" class="w-px mx-[20vmin] h-[60%] flex-shrink-0 opacity-50 bg-black/20"></div>
        <div id="col-content" class="flex flex-row items-center h-full flex-1 min-w-0 gap-[2vmin] px-0 overflow-hidden">
            <div id="channel-content" class="flex-1 min-w-0 flex items-center overflow-hidden ms-[30vmin]">
                <div id="channel-inner" class="w-full min-w-0 flex items-center overflow-hidden"></div>
            </div>
        </div>
        <div id="divider-2" class="w-px mx-[20vmin] h-[80%] flex-shrink-0 opacity-50 bg-black/20"></div>
        <div id="col-clock" class="flex flex-col items-center justify-center h-full flex-shrink min-w-0 max-w-[30vw] gap-[10vmin] px-[20vmin]">
            <div id="clock-time" class="font-poppins-extrabold text-[34vmin] leading-none whitespace-nowrap text-center"></div>
            <div id="clock-date" class="text-[18vmin] leading-none whitespace-nowrap text-center opacity-75"></div>
        </div>
    </div>
</body>

</html>

<!-- Templates para módulos -->
<template id="tpl-clima">
    <div class="flex flex-row items-center gap-[2vmin] w-full min-w-0 text-[42vmin] relative">
        <span class="flex items-center justify-center flex-shrink-0 size-[90vmin]">
            <!-- SVG do clima será injetado aqui -->
        </span>
        <!-- Slide 1: Temperaturas -->
        <div class="clima-slide clima-slide-1 flex items-center gap-[2vmin] transition-opacity duration-500 opacity-0 hidden absolute left-0 ps-[100vmin] top-0 w-full h-full">
            <span class="font-bold text-[12vmin] ms-[10vmin]" data-clima-temp-atual></span>
            <span class="flex gap-[20vmin] ms-[10vmin]">
                <span class="flex items-center gap-[8vmin] font-bold opacity-80">
                    <span class="-ms-[30vmin] inline-flex size-[90vmin] align-middle" data-clima-max-ico></span>
                    <span class="-ms-[30vmin]" data-clima-max></span>
                </span>
                <span class="flex items-center gap-[8vmin] font-bold opacity-80 ml-[2vmin]">
                    <span class="-ms-[30vmin] inline-flex size-[90vmin] align-middle" data-clima-min-ico></span>
                    <span class="-ms-[30vmin]" data-clima-min></span>
                </span>
            </span>
        </div>
        <!-- Slide 2: Descrição -->
        <div class="clima-slide clima-slide-2 flex items-center ms-[40vmin] transition-opacity duration-500 opacity-0 hidden absolute left-0 ps-[50vmin] top-0 w-full h-full">
            <span class="text-[60%]" data-clima-desc></span>
        </div>
        <!-- Slide 3: Vento, Umidade, UV -->
        <div class="clima-slide clima-slide-3 flex items-center gap-[30vmin] ms-[10vmin] transition-opacity duration-500 opacity-0 hidden absolute left-0 ps-[100vmin] top-0 w-full h-full">
            <span class="opacity-80 flex items-center gap-[4vmin]" data-clima-umidade>
                <span class="inline-flex size-[100vmin] align-middle" data-clima-umidade-ico></span>
                <span class="-ms-[30vmin]" data-clima-umidade-text></span>
            </span>
            <span class="opacity-80 flex items-center gap-[4vmin]" data-clima-vento>
                <span class="inline-flex size-[100vmin] align-middle" data-clima-vento-ico></span>
                <span class="-ms-[30vmin] text-[70%]" data-clima-vento-text></span>
                <span class="inline-flex size-[50vmin] align-middle" data-clima-vento-compass></span>
            </span>
            <span class="opacity-80 text-[70%]" data-clima-uv>
                <span class="inline-flex size-[100vmin] align-middle" data-clima-umidade-ico></span>
                <span class="-ms-[10vmin]" data-clima-uv-text></span>
            </span>
        </div>
    </div>
</template>


<template id="tpl-financeiro">
    <div class="flex flex-row items-center gap-[2vmin] w-full min-w-0 text-[42vmin] relative">
        <!-- Slide 1: Moedas -->
        <div class="financeiro-slide financeiro-slide-moedas flex items-center gap-[30vmin] ms-[10vmin] transition-opacity duration-500 opacity-0 hidden absolute left-0 ps-[100vmin] top-0 w-full h-full">
            <div class="financeiro-item" data-fin-moeda-1></div>
            <div class="financeiro-item" data-fin-moeda-2></div>
            <div class="financeiro-item" data-fin-moeda-3></div>
        </div>
        <!-- Slide 2: Bolsas -->
        <div class="financeiro-slide financeiro-slide-bolsas flex items-center gap-[30vmin] ms-[10vmin] transition-opacity duration-500 opacity-0 hidden absolute left-0 ps-[100vmin] top-0 w-full h-full">
            <div class="financeiro-item" data-fin-bolsa-1></div>
            <div class="financeiro-item" data-fin-bolsa-2></div>
            <div class="financeiro-item" data-fin-bolsa-3></div>
        </div>
    </div>
</template>

<!-- Template de item (usado pelo JS para clonar) -->
<template id="tpl-financeiro-item">
    <div class="flex flex-row items-center gap-[2vmin] w-full min-w-0 text-[42vmin]">
        <span class="flex items-center justify-center flex-shrink-0 size-[90vmin]" data-fin-ico></span>
        <span class="opacity-80 ms-[10vmin]" data-fin-nome></span>
        <span class="font-bold text-[10vmin] ms-[10vmin]" data-fin-valor></span>
        <img class="h-[38vmin] w-auto inline ms-[4vmin]" data-fin-seta style="display:none" />
        <span class="ms-[4vmin]" data-fin-var></span>
    </div>
</template>

</html>

</html>
