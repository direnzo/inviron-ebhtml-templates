<!DOCTYPE html>
<html lang="pt-br" class="overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/master.css">

    <!-- Mock data para desenvolvimento (comentar em produção) -->
    <script src="js/mock-data.js"></script>

    <script src="js/ebhtml.js"></script>
    <script src="js/master.js"></script>
    <title>Preço Combustível - Prismaturismo</title>
</head>
<body class="overflow-hidden">
    <div id="container" class="antialiased overflow-hidden">

        <!-- Header: logos da bandeira e do posto -->
        <div id="header">
            <div id="logo-bandeira-wrap">
                <img id="img-bandeira" src="" alt="">
            </div>
            <div id="logo-posto-wrap">
                <img id="img-posto" src="" alt="">
            </div>
        </div>

        <!-- Área do preço -->
        <div id="preco-area">
            <div id="preco-block">
                <span id="preco-rs" class="opacity-0">R$</span>
                <span id="preco-valor" class="opacity-0">0,00</span>
            </div>
        </div>

        <!-- Rodapé: nome do combustível com cor dinâmica -->
        <div id="footer" class="opacity-0">
            <span id="combustivel-nome">GASOLINA</span>
            <span id="combustivel-subtipo">COMUM</span>
        </div>

    </div>
</body>
</html>
