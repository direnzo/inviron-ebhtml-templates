<html class="bg-black h-full w-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOL</title>
    <link rel="stylesheet" href="css/master.css">
    <script src="js/ebhtml.js"></script>
    <!-- <script src="js/mock-data.js"></script> -->
    <script src="js/master.js"></script>

</head>

<body class="relative min-h-screen w-full overflow-hidden opacity-0 transition-opacity duration-1000 text-[3vw]  text-white
    square:text-[3.4vw]
    portrait:text-[3.8vh] 
    ultrawide:text-[10vh]
    superbanner:text-[15vh] superbanner:leading-tight
    footer:text-[30vh] footer:leading-tight
    empena:!text-[2vh] empena:leading-relaxed">

    <div id="size" class="hidden"></div>
    <!-- <header id="bgContainer" class="hidden absolute inset-0 -z-10 ">
        <img id="bgImage" src="" alt="background image"
            class="w-full h-full object-cover opacity-0 transition-opacity duration-1000">
    </header> -->

    <main id="main" class="absolute flex flex-col w-full h-full min-h-screen z-10
         ultrawide:!flex-row ultrawide:items-stretch
         portrait:flex-col
         landscape:flex-col">

        <!-- FOTO -->
        <div id="photoContainer" class="overflow-hidden w-full h-full flex items-center justify-center
           ultrawide:w-2/3 ultrawide:h-full 
           square:!h-full
           portrait:h-2/3
           superbanner:w-full superbanner:justify-between
           footer:hidden">
            <img id="image" src="" alt="image" class="h-full w-full max-w-full max-h-full object-cover bg-no-repeat transition-all ease-linear duration-[15000ms] 
                superbanner:w-1/3 
                portrait:object-left
                empena:object-left">
            <img id="image2" src="" alt="image" class="hidden h-full w-full max-w-full max-h-full object-cover transition-all ease-linear duration-[15000ms]
                superbanner:w-1/3 superbanner:block">
        </div>

        <!-- BOX CONTEUDO -->
        <div id="textContainer" class="absolute bottom-0 z-20 w-full h-[80vh] pt-[30vh] flex flex-col justify-start p-0
           bg-gradient-to-t from-black from-10% to-transparent
           square:!pt-[40vh]
           landscape:pt-[45vh]
           portrait:from-50% portrait:pt-[30vh]
           ultrawide:w-[80vw] ultrawide:h-full ultrawide:ps-[30vw] ultrawide:!pt-0 ultrawide:right-0 ultrawide:bg-gradient-to-l ultrawide:from-50%
           superbanner:w-full superbanner:px-[25vw] superbanner:bg-[linear-gradient(90deg,_transparent_0%,_black_30%,_black_70%,_transparent_100%)]
           footer:w-full footer:ps-0 footer:flex-row footer:justify-center">

            <!-- Logo e título -->
            <div class="flex flex-row items-start gap-[2%] max-h-[10vh]
            ultrawide:max-h-[20vh]
            footer:max-h-full footer:py-5
            empena:flex-col empena:items-center">
                <div id="logoContent" class="flex items-center h-full justify-center p-[2%]">
                    <img id="logo" src="img/logo.png" title="logo" class="max-w-[10vw] object-contain object-center p-[3%]
                    square:max-w-[20vw] 
                    portrait:max-w-[15vw]
                    ultrawide:max-h-[15vh]
                    footer:max-h-[50vh] 
                    empena:!max-h-[100vh] empena:!max-w-[30vw]">
                </div>
                <div id="titleContainer" class="flex-1 flex items-center rounded-l-full h-full ps-[4vw] whitespace-nowrap
                superbanner:rounded-full
                footer:rounded-full footer:ps-0
                empena:rounded-full">
                    <div id="title" class="font-bold font-poppins-bold mx-5"></div>
                </div>
            </div>
            <!-- Descrição -->
            <div id="descriptionContainer" class="flex-1 h-full flex items-center justify-center px-[2vw] overflow-hidden">
                <div id="description" class="text-left  font-poppins-medium ps-[2%] overflow-hidden"></div>
            </div>
        </div>
    </main>

    <!-- Créditos -->
    <footer id="credit" class="hidden absolute z-40 left-5 top-1/2 transform -translate-y-1/2 rotate-[-90deg] origin-left text-[30%]
        md:block
        portrait:top-1/3 
        ultrawide:top-1/2
        footer:!hidden">
    </footer>


</body>

</html>
