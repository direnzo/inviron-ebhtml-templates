<html>

<head>
    <meta charset="UTF-8">
    <title>Projeto Especial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/master.css">
    <script src="js/config.js"></script>
    <script src="js/ebhtml.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/layout-engine.js"></script>
    <script src="js/price-engine.js"></script>
    <script src="js/runtime-engine.js"></script>
    <script src="js/master.js"></script>
    <script src="js/preview.js"></script>

    <script>
        var checkElement = null;
        try {
            if (window.parent && window.parent.document) {
                checkElement = window.parent.document.getElementById('template_check');
            }
        } catch (e) {
            checkElement = null;
        }

        if (checkElement !== null) {
            extranetView();
        } else {
            playerView();
        }
    </script>
</head>

<body class="bg-white overflow-hidden text-[4.5vh] portrait:text-[3.5vh] landscape:text-[2vw] ultrawide:text-[3vh] text-black font-gotham-bold opacity-0 transition-opacity duration-500">
    <!-- Fundo: vídeo -->
    <div class="absolute inset-0 z-0">
        <video id="video" class="h-full w-full object-fill" muted autoplay>
            <source src="img/armazzem-03.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Safe area branca: elementos dinamicos ficam somente aqui -->
    <div id="fullContent" class="absolute inset-x-0 bottom-0 bg-[#FFFFFF] z-10 opacity-0 transition-opacity duration-300 delay-75 overflow-hidden">

        <!-- 1. LOGO -->
        <div id="logo_container" class="hidden shrink-0 items-center justify-center h-[10vh] portrait:h-[11vh] w-full px-4">
            <img id="logo" class="max-h-full" />
        </div>

        <div id="content_split" class="w-full h-full flex flex-col landscape:flex-row">

            <!-- Coluna esquerda (landscape): somente imagem -->
            <div id="img_container" class="basis-[45%] landscape:basis-[52%] shrink-0 flex items-center justify-center overflow-hidden min-h-0 translate-x-full transition-transform duration-1000 px-4 py-1 landscape:py-3">
                <div id="product_frame" class="w-[80vw] h-[100%] portrait:w-[86vw] landscape:w-[92%] ultrawide:w-[72%] flex items-center justify-center overflow-hidden rounded-xl">
                    <img id="product_img" src="" class="w-full h-full object-contain p-3 animate-[wiggle_1s_ease-in-out_infinite]" />
                </div>
            </div>

            <!-- Coluna direita (landscape): titulo + preco + legal -->
            <div id="info_column" class="flex-1 min-w-0 flex flex-col border-t border-black/15 landscape:justify-center landscape:border-t-0 landscape:border-l landscape:border-black/15">
                <!-- 3. TÍTULO DO PRODUTO -->
                <div id="title_container" class="basis-[30%] landscape:basis-[31%] shrink-0 flex items-center justify-center landscape:justify-end w-full opacity-0 -translate-x-full transition-all duration-1000 delay-100 px-4 py-0 my-2 landscape:pb-0">
                    <div id="title" class="w-full text-center leading-tight overflow-hidden max-h-[100%]"></div>
                </div>

                <!-- 4. PREÇO -->
                <div id="price_display" class="basis-[52%] landscape:basis-[53%] shrink-0 w-full flex items-center justify-center landscape:items-start translate-y-full transition-transform duration-700 delay-200 mt-1 landscape:mt-0"></div>

            </div>
        </div>

        <!-- Texto legal: fixo na borda inferior, anima com opacity -->
        <div id="legal_text" class="absolute inset-x-0 bottom-[0.5vh] text-[36%] portrait:text-[34%] landscape:text-[28%] text-center w-full px-4 opacity-0 transition-opacity duration-700 delay-1000"></div>
    </div>

    <!-- ── SUB-TEMPLATES REUTILIZÁVEIS ───────────────────────────────────────── -->
    <!-- Injetados via JS em cada slot data-price-hero / data-price2-hero       -->

    <!-- Bloco hero padrão: símbolo + inteiro + stack(centavos + unidade) — PRICE -->
    <template id="tpl-price-inner">
        <span data-price-part="symbol" class="price-symbol"></span>
        <span data-price-part="integer" class="price-integer"></span>
        <div class="price-stack">
            <span data-price-part="decimal" class="price-decimal">
                <span class="opacity-70">,</span><span></span>
            </span>
            <span data-price-part="unit" class="price-unit"></span>
        </div>
    </template>

    <!-- Bloco hero padrão: símbolo + inteiro + stack(centavos + unidade) — PRICE2 -->
    <template id="tpl-price2-inner">
        <span data-price-part="symbol" class="price-symbol"></span>
        <span data-price-part="price2-integer" class="price-integer"></span>
        <div class="price-stack">
            <span data-price-part="price2-decimal" class="price-decimal">
                <span class="opacity-70">,</span><span></span>
            </span>
            <span data-price-part="unit" class="price-unit"></span>
        </div>
    </template>

    <!-- ── TEMPLATES DE CONDIÇÃO ──────────────────────────────────────────────── -->
    <!-- data-price-hero  → JS injeta tpl-price-inner  (PRICE)                   -->
    <!-- data-price2-hero → JS injeta tpl-price2-inner (PRICE2)                  -->
    <!-- data-unit-class  → classe extra aplicada ao span.price-unit injetado     -->

    <!-- REGULAR -->
    <template id="template_regular">
        <div class="price-root gap-[0.15em]" data-price-layout="regular" data-theme="default">
            <div class="price-row" data-price-hero></div>
        </div>
    </template>

    <!-- DE/POR: prefixo "DE R$X" + "POR" inline no price-row -->
    <template id="template_depor">
        <div class="price-root gap-[0.2em] landscape:gap-[0.14em] font-gotham-bold" data-price-layout="depor" data-theme="default">
            <div data-price-part="old-price" class="flex flex-row items-center gap-[0.2em] opacity-70">
                <span class="text-[55%]">DE</span>
                <span class="text-[60%] line-through decoration-2 price-symbol">R$</span>
                <span class="text-[100%] line-through decoration-2"></span>
            </div>
            <div class="price-row" data-price-hero>
                <span class="text-[75%] self-start">POR</span>
            </div>
        </div>
    </template>

    <!-- LEVE 3 PAGUE 2: badge prefixo + sufixo "cada unidade" -->
    <template id="template_leve3pague2">
        <div class="price-root gap-[0.35em]" data-price-layout="leve3pague2" data-theme="promo">
            <div data-price-label class="price-badge bg-current text-white">LEVE 3 PAGUE 2</div>
            <div class="price-row" data-price-hero></div>
            <div class="font-gotham-book text-[45%] opacity-70">cada unidade</div>
        </div>
    </template>

    <!-- LEVE 3 PAGUE 1: badge prefixo + sufixo "na compra de 3 unidades" -->
    <template id="template_leve3pague1">
        <div class="price-root gap-[0.35em]" data-price-layout="leve3pague1" data-theme="promo">
            <div data-price-label class="price-badge bg-green-700 text-white">LEVE 3 PAGUE 1</div>
            <div class="price-row" data-price-hero></div>
            <div class="font-gotham-book text-[45%] opacity-70">na compra de 3 unidades</div>
        </div>
    </template>

    <!-- CLUBE: badge estrela prefixo, cor azul, unidade em azul claro -->
    <template id="template_clube">
        <div class="price-root gap-[0.35em]" data-price-layout="clube" data-theme="clube">
            <div class="bg-blue-700 text-white font-gotham-ultra px-5 py-[0.2em] rounded-md text-[50%] tracking-wide uppercase">
                ★ <span data-price-label>PRECO CLUBE</span> ★
            </div>
            <div class="price-row text-blue-700" data-price-hero data-unit-class="text-blue-500"></div>
        </div>
    </template>

    <!-- OFERTA: fundo vermelho, texto amarelo, unidade branca -->
    <template id="template_oferta">
        <div class="price-root gap-[0.3em] bg-red-600" data-price-layout="oferta" data-theme="oferta">
            <div data-price-label class="text-white font-gotham-ultra text-[50%] tracking-widest uppercase">OFERTA IMPERDIVEL</div>
            <div class="price-row text-yellow-300" data-price-hero data-unit-class="text-white"></div>
        </div>
    </template>

    <!-- ATACAREJO: hero PRICE2 (atacado) + secundário PRICE (unitário) -->
    <template id="template_atacarejo">
        <div class="price-root gap-[0.12em]" data-price-layout="atacarejo" data-theme="atacarejo">
            <div class="flex flex-col items-center gap-[0.12em] w-full">
                <div class="price-row" data-price2-hero></div>
                <div class="font-gotham-book text-[52%] landscape:text-[48%] text-center opacity-70 max-w-[90%]">
                    a partir de <span data-price-part="qty" class="font-gotham-bold"></span> unidades
                </div>
            </div>
            <div class="w-[82%] h-px bg-current opacity-25"></div>
            <div class="price-row opacity-65 max-w-[84vw] gap-[0.14em] text-[40%]" data-price-hero></div>
            <span class="text-[40%] -mt-1">Preço normal por unidade</span>
        </div>
    </template>

    <!-- PARC-SEM-J: hero "em N × PRICE2" + badge + secundário "à vista PRICE" -->
    <!-- Secundário mantém HTML próprio (tamanhos customizados, sem unit) -->
    <template id="template_parcsemj">
        <div class="price-root gap-[0.32em]" data-price-layout="parcsemj" data-theme="parcsemj">
            <div class="price-row gap-[0.24em] items-center">
                <span class="font-gotham-book text-[58%] self-center opacity-70">em</span>
                <span data-price-part="qty" class="font-gotham-ultra leading-none text-[292%] landscape:text-[320%] self-start"></span>
                <span class="font-gotham-bold self-center leading-none">X</span>
                <div class="text-[40%] flex ml-2" data-price2-hero></div>
            </div>
            <div data-price-label class="price-badge bg-emerald-600 text-white rounded-full tracking-[0.12em] text-[58%]">SEM JUROS</div>
            <div class="price-row opacity-65 max-w-[84vw] gap-[0.14em]">
                <span class="font-gotham-bold text-[46%] uppercase tracking-[0.08em] self-start">a vista</span>
                <span data-price-part="symbol" class="price-symbol">R$</span>
                <span data-price-part="integer" class="font-gotham-ultra leading-none tracking-tight text-[178%] landscape:text-[192%]"></span>
                <div class="price-stack">
                    <span data-price-part="decimal" class="font-gotham-ultra leading-none text-[78%]">
                        <span class="opacity-70">,</span><span></span>
                    </span>
                </div>
            </div>
        </div>
    </template>

    <!-- LEVE X PAGUE Y: badge dinâmico + sufixo "preço por unidade" -->
    <template id="template_levexaguey">
        <div class="price-root gap-[0.35em]" data-price-layout="levexaguey" data-theme="promo">
            <div class="price-badge bg-current text-white">
                LEVE&nbsp;<span data-price-part="qty" class="font-gotham-ultra">X</span>&nbsp;PAGUE&nbsp;<span data-price-part="qty2" class="font-gotham-ultra">Y</span>
            </div>
            <div class="price-row" data-price-hero></div>
            <div class="font-gotham-book text-[45%] opacity-70">preço por unidade</div>
        </div>
    </template>

    <!-- FIDELIDADE: badge + prefixo "DE R$X" + hero PRICE2 azul -->
    <template id="template_fidelidade">
        <div class="price-root gap-[0.2em] landscape:gap-[0.14em] font-gotham-bold" data-price-layout="fidelidade" data-theme="clube">
            <div class="bg-blue-700 text-white font-gotham-ultra px-5 py-[0.2em] rounded-md text-[50%] tracking-wide uppercase">
                ★ FIDELIDADE ★
            </div>
            <div data-price-part="price-original" class="flex flex-row items-center gap-[0.2em] opacity-60">
                <span class="text-[55%]">DE</span>
                <span class="text-[60%] line-through decoration-2">R$</span>
                <span class="text-[100%] line-through decoration-2"></span>
            </div>
            <div class="price-row text-blue-700" data-price2-hero data-unit-class="text-blue-500"></div>
        </div>
    </template>

</body>

</html>
